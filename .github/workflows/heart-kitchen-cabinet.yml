name: Heart kitchen cabinet purchase and storage
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/scripts/12-game.js'
      - 'tests/heart-kitchen-cabinet-ci.mjs'
      - '.github/workflows/heart-kitchen-cabinet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kitchen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve arcade
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/heart-kitchen.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Purchase and use sink cabinet on desktop and phone
        run: node tests/heart-kitchen-cabinet-ci.mjs
      - name: Upload room screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-kitchen-cabinet-preview
          path: heart-kitchen-*.png
          retention-days: 7
          if-no-files-found: warn
