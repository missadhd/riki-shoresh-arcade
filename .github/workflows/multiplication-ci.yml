name: Multiplication arcade and navigation regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/scripts/15-multiplication.js'
      - 'assets/styles/18-multiplication.css'
      - 'assets/scripts/14-accounts.js'
      - 'tests/multiplication-ci.mjs'
      - '.github/workflows/multiplication-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/riki-math.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Play all three math games, test top tabs and saved progress
        run: node tests/multiplication-ci.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiplication-desktop-mobile
          path: math-arcade-*.png
          retention-days: 7
          if-no-files-found: warn
