name: Preview check (screenshots)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browsers
        # npx alone only fetches the CLI temporarily; the script imports 'playwright', so install it
        # into the workspace (no package.json, same pinned version as social-detective-regression).
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 &
          sleep 2
          echo "Server started on 4173"
      - name: Capture preview screenshots
        run: |
          mkdir -p preview-shots
          cat > ./preview-shots.tmp.mjs << 'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.screenshot({ path: 'preview-shots/home.png', fullPage: true });
          const shot = async (name) => { await page.waitForTimeout(1500); await page.screenshot({ path: `preview-shots/${name}.png`, fullPage: true }); };
          // Dolls & Pets (phone shortcut)
          const dolls = page.locator('#rkDollsShortcut:visible').first();
          if (await dolls.count()) { await dolls.click(); await shot('dolls-and-pets'); }
          // Dollhouse: from home, the visible house tile (#hubHouse on phones, #houseShortcut on wider screens)
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          const house = page.locator('#hubHouse:visible, #houseShortcut:visible').first();
          if (await house.count()) {
            await house.click();
            await shot('dollhouse');
            const decorate = page.locator('#decorateTab:visible').first();
            if (await decorate.count()) { await decorate.click(); await shot('decorate'); }
          }
          await browser.close();
          console.log('Screenshots saved');
          JS
          node ./preview-shots.tmp.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: preview-screenshots
          path: preview-shots/
          retention-days: 7
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- riki-preview-screenshots -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const msg = `${marker}\nPreview screenshots (390px: home, Dolls & Pets, Dollhouse, Decorate) are attached as the **preview-screenshots** artifact on [the latest run](${run}) (commit ${context.payload.pull_request.head.sha.slice(0, 7)}).\n\n(The live site only updates after merge to main. This comment is updated on each push.)`;
            const { owner, repo } = context.repo, issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user && c.user.type === 'Bot' && c.body && (c.body.includes(marker) || c.body.startsWith('Preview screenshots uploaded as an artifact')));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: msg });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: msg });
