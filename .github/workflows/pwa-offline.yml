name: PWA offline smoke test
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'tests/pwa-offline-ci.mjs'
      - '.github/workflows/pwa-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/riki-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify online install and offline reload
        run: node tests/pwa-offline-ci.mjs
      - name: Upload screenshot if test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-offline-debug
          path: pwa-offline-failure.png
          if-no-files-found: ignore
