/* Three creative interactive learning worlds */

.order-ticket{background:#fffdf7;border:3px dashed #f6a2c8;border-radius:16px;padding:12px;margin:10px auto;max-width:440px}

.creative-progress{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.customer{font-size:44px;animation:floaty 2.2s ease-in-out infinite alternate}.served{animation:served .7s ease-out both}@keyframes served{from{transform:translateX(-70px) scale(.65);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}@keyframes floaty{to{transform:translateY(-6px)}}

if(type==='Tables')art=`<ellipse cx="75" cy="118" rx="57" ry="11" fill="#40335a25"/><path d="M37 65 L31 112 M112 65 L118 112" stroke="${shade}" stroke-width="11" stroke-linecap="round"/><ellipse cx="75" cy="62" rx="57" ry="20" fill="${shade}"/><ellipse cx="75" cy="57" rx="57" ry="19" fill="${main}"/><ellipse cx="75" cy="53" rx="39" ry="9" fill="#ffffff50"/>`;
else if(type==='Chairs')art=`<ellipse cx="75" cy="120" rx="42" ry="9" fill="#40335a25"/><path d="M47 76 L42 117 M103 76 L108 117" stroke="${shade}" stroke-width="10" stroke-linecap="round"/><rect x="39" y="23" width="72" height="65" rx="22" fill="${shade}"/><rect x="45" y="28" width="60" height="55" rx="18" fill="${main}"/><rect x="31" y="77" width="88" height="20" rx="9" fill="${shade}"/><rect x="37" y="75" width="76" height="15" rx="7" fill="${main}"/>`;
else if(type==='Beds')art=`<ellipse cx="76" cy="119" rx="65" ry="10" fill="#40335a25"/><rect x="13" y="51" width="124" height="66" rx="15" fill="${shade}"/><rect x="18" y="24" width="114" height="70" rx="24" fill="${main}"/><rect x="18" y="66" width="114" height="43" rx="12" fill="#f8ecfa"/><rect x="26" y="59" width="43" height="20" rx="9" fill="#fff"/><rect x="76" y="59" width="43" height="20" rx="9" fill="#fff"/><path d="M18 91 Q74 112 132 91 L132 109 L18 109Z" fill="${main}"/>${id==='bedcanopy'?'<path d="M17 25 L17 6 L132 6 L132 25" fill="none" stroke="#e1a0c9" stroke-width="6"/><path d="M18 9 Q35 35 44 9 M106 9 Q119 35 132 9" fill="#ffd6ec"/>':''}`;
else if(type==='Sofas')art=`<ellipse cx="75" cy="120" rx="64" ry="9" fill="#40335a25"/><rect x="13" y="35" width="124" height="75" rx="23" fill="${shade}"/><rect x="21" y="41" width="108" height="56" rx="17" fill="${main}"/><rect x="15" y="76" width="120" height="30" rx="14" fill="${shade}"/><rect x="23" y="73" width="104" height="25" rx="12" fill="${main}"/><path d="M75 48 V92" stroke="${shade}" stroke-width="3"/><rect x="18" y="103" width="13" height="15" rx="3" fill="#ad7b56"/><rect x="119" y="103" width="13" height="15" rx="3" fill="#ad7b56"/>`;
else if(type==='Vanities')art=`<ellipse cx="75" cy="120" rx="57" ry="9" fill="#40335a25"/><rect x="39" y="15" width="72" height="75" rx="35" fill="${shade}"/><rect x="45" y="21" width="60" height="63" rx="29" fill="#d5f2ff"/><path d="M52 64 Q60 36 85 30" stroke="#fff" stroke-width="5" opacity=".8" fill="none"/><rect x="20" y="85" width="110" height="20" rx="6" fill="${main}"/><path d="M34 103 L30 119 M116 103 L120 119" stroke="${shade}" stroke-width="9"/>`;
else if(type==='Appliances')art=`<ellipse cx="75" cy="120" rx="53" ry="8" fill="#40335a25"/><rect x="35" y="13" width="80" height="107" rx="12" fill="${shade}"/><rect x="41" y="17" width="68" height="98" rx="9" fill="${main}"/><rect x="48" y="49" width="54" height="4" rx="2" fill="#fff"/><rect x="48" y="27" width="54" height="16" rx="5" fill="#fff9"/><rect x="48" y="62" width="7" height="29" rx="3" fill="#fff"/>`;
else return `<span class="art-emoji">${it[1]}</span>`;
return `<svg class="furniture-svg" viewBox="0 0 150 130" role="img" aria-label="${esc(it[2])}">${art}</svg>`}
function shopHtml(){const filtered=ITEMS.filter(it=>shopRoom==='party'?['Birthday','Undersea','Girly'].includes(itemType(it)): (it[4]===shopRoom||it[4]==='any')&&itemType(it)===shopType);return `<section class="panel"><h2 class="sectiontitle">🛍️ Dream Dollhouse Boutique</h2><p class="subtle">Choose a room, then a type of furniture. Pick your favorite style!</p><div class="shop-categories">${[...ROOMS.map(r=>[r.id,r.icon+' '+r.name]),['party','🎉 Themes & parties']].map(([id,name])=>`<button class="${shopRoom===id?'active':''}" data-shop-room="${id}">${name}</button>`).join('')}</div><div class="shop-categories subcats">${CATEGORIES[shopRoom].map(t=>`<button class="${shopType===t?'active':''}" data-shop-type="${t}">${t}</button>`).join('')}</div><div class="shop-grid">${filtered.map(it=>`<div class="shop-item ${ownedItem(it[0])?'owned':''}"><div class="pic">${furnitureArt(it)}</div><div class="name">${esc(it[2])}</div><div class="price">${ownedItem(it[0])?'✓ Owned':'🪙 '+it[3]+' coins'}</div><button data-buy="${it[0]}" ${ownedItem(it[0])||coins<it[3]?'disabled':''}>${ownedItem(it[0])?'Collected!':coins<it[3]?'Save up':'Buy it!'}</button></div>`).join('')}</div>${filtered.length?'':'<p>More furniture coming soon!</p>'}</section>`}
function bindShop(){document.querySelectorAll('[data-shop-room]').forEach(b=>b.onclick=()=>{shopRoom=b.dataset.shopRoom;shopType=CATEGORIES[shopRoom][0];audio('tap');houseRender()});document.querySelectorAll('[data-shop-type]').forEach(b=>b.onclick=()=>{shopType=b.dataset.shopType;audio('tap');houseRender()});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x[0]===b.dataset.buy);if(!it||ownedItem(it[0])||coins<it[3])return;coins-=it[3];owned.push(it[0]);saveHouse();try{localStorage.setItem('rickyCoins',coins)}catch{}audio('win');celebrate();updateStats();housePage='decorate';selectedItem=it[0];currentRoom=it[4]==='any'?currentRoom:it[4];houseMessage=`🎁 You bought ${it[2]}! Tap a dotted spot to place it.`;houseRender()})}
const SLOTS=[{x:20,y:25},{x:50,y:22},{x:78,y:24},{x:19,y:52},{x:50,y:51},{x:80,y:52},{x:18,y:81},{x:49,y:82},{x:80,y:82}];
function decorateHtml(){const r=roomData(),placements=decor[currentRoom]||{},usable=ITEMS.filter(it=>ownedItem(it[0])&&canUse(it,currentRoom));return `<section class="panel"><h2 class="sectiontitle">🎨 Decorate your ${r.name.toLowerCase()}</h2><div class="room-tabs">${ROOMS.map(room=>`<button data-room="${room.id}" class="${currentRoom===room.id?'active':''}">${room.icon} ${room.name}</button>`).join('')}</div><div class="house-stage ${currentRoom}" style="--wall:${wallColors[currentRoom]||r.wall};--floor:${r.floor}"><div class="house-window"></div><div class="house-rug"></div>${SLOTS.map((slot,i)=>`<button class="house-slot ${selectedItem?'ready':''}" data-slot="${i}" style="left:${slot.x}%;top:${slot.y}%" aria-label="Decorate spot ${i+1}"></button>${placements[i]?`<button class="house-item ${selectedItem===placements[i]?'selected':''}" data-item-slot="${i}" style="left:${slot.x}%;top:${slot.y}%" title="Move or remove ${ITEMS.find(it=>it[0]===placements[i])?.[2]||''}">${furnitureArt(ITEMS.find(it=>it[0]===placements[i])||ITEMS[0])}</button>`:''}`).join('')}</div><p class="house-help">${houseMessage||'Choose an item below, then tap a dotted spot in the room to place it. Tap furniture to pick it up or move it.'}</p><h3>🎁 Your furniture collection</h3>${usable.length?`<div class="inventory">${usable.map(it=>`<button data-select="${it[0]}" class="${selectedItem===it[0]?'active':''}" title="${esc(it[2])}">${furnitureArt(it)} <span class="tiny">${esc(it[2])}</span></button>`).join('')}</div>`:'<div class="house-banner">Your room is waiting for furniture! Visit the shop to buy your first piece. 🛍️</div>'}<div class="row" style="justify-content:center;margin-top:15px"><button class="secondary" id="removeItem" ${!selectedItem?'disabled':''}>🧺 Remove selected from room</button><button class="primary" id="goShop">🛍️ Shop for more</button></div><h3>🎨 Choose a wall color</h3><div class="decor-options">${[['#fbe3f4','🌸 Pink'],['#e3e0ff','💜 Lavender'],['#d9f6ed','🌿 Mint'],['#d7f6ff','🩵 Sky'],['#fff0cb','☀️ Cream']].map(([c,label])=>`<button data-wall="${c}" class="${(wallColors[currentRoom]||r.wall)===c?'active':''}">${label}</button>`).join('')}</div></section>`}
function bindDecor(){document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{currentRoom=b.dataset.room;selectedItem='';houseMessage='';audio('tap');houseRender()});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selectedItem=b.dataset.select;houseMessage='Tap a dotted spot in the room to place '+ITEMS.find(it=>it[0]===selectedItem)[2]+'.';audio('tap');houseRender()});document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{if(!selectedItem){houseMessage='Choose a piece of furniture below first!';audio('bad');houseRender();return}const slot=b.dataset.slot;const placements=decor[currentRoom]||{};for(const k of Object.keys(placements))if(placements[k]===selectedItem)delete placements[k];placements[slot]=selectedItem;decor[currentRoom]=placements;saveHouse();audio('good');houseMessage='✨ Beautiful! Pick another item or try a different room.';selectedItem='';houseRender()});document.querySelectorAll('[data-item-slot]').forEach(b=>b.onclick=()=>{const slot=b.dataset.itemSlot;const placements=decor[currentRoom]||{};selectedItem=placements[slot];houseMessage='Tap a different dotted spot to move it, or choose Remove selected.';audio('tap');houseRender()});$('#removeItem').onclick=()=>{if(!selectedItem)return;const placements=decor[currentRoom]||{};for(const k of Object.keys(placements))if(placements[k]===selectedItem)delete placements[k];saveHouse();selectedItem='';houseMessage='Item returned to your collection — you still own it!';audio('tap');houseRender()};$('#goShop').onclick=()=>{housePage='shop';audio('tap');houseRender()};document.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>{wallColors[currentRoom]=b.dataset.wall;saveHouse();audio('good');houseRender()})}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ids(){return mode==='new'?Array.from({length:12},(_,i)=>i+26):mode==='old'?Array.from({length:26},(_,i)=>i):Array.from({length:38},(_,i)=>i)}
function topSettings(){return `<div class="panel settings"><label for="set">📚 Word set</label><select id="set"><option value="new" ${mode==='new'?'selected':''}>New 12 words</option><option value="old" ${mode==='old'?'selected':''}>Original 26 words</option><option value="all" ${mode==='all'?'selected':''}>All 38 words</option></select><span class="subtle">No stressful countdowns. Take your time! 💜</span></div>`}
function menu(){game='';session=null;app.innerHTML=`<section class="hero"><div class="spark">🦄 🌟 🦋</div><h1>Pick your adventure!</h1><p>Six different games, magical rewards, and new surprises every round. Which challenge will you conquer?</p></section>${topSettings()}<section class="panel"><h2 class="sectiontitle">🎮 Choose a game</h2><div class="games">${[['detective','🔎','Mystery Detective','Read clues and solve the Hebrew mystery.','Think & solve'],['memory','🃏','Magic Memory','Flip cards and find matching pairs.','Remember & match'],['bubbles','🫧','Bubble Pop','Pop the bubble with the right meaning.','Quick & playful'],['builder','🧩','Letter Builder','Build the Hebrew shoresh letter by letter.','Spell & create'],['sort','🚀','Rocket Launch','Pick the Hebrew root to launch your rocket.','Reverse challenge'],['wheel','🎡','Spin the Word Wheel','Spin to practice prefixes, suffixes, and Hebrew word parts.','Spin & discover']].map(g=>`<button class="gamecard" data-game="${g[0]}"><span class="emoji">${g[1]}</span><strong>${g[2]}</strong><p>${g[3]}</p><span class="tag">${g[4]}</span></button>`).join('')}</div></section><section class="panel" style="text-align:center"><h2>🏠 Your Dream Dollhouse</h2><div class="reward"><span>💎</span><span>👑</span><span>🌈</span></div><p>Play Shoresh games to earn coins, then shop for furniture and decorate your own dollhouse!</p><strong>🪙 ${coins} coins available</strong><p><button class="primary" id="visitHouse">🏠 Visit my dollhouse!</button></p></section>`;$('#set').onchange=e=>{mode=e.target.value;audio('tap')};document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));$('#visitHouse').onclick=houseHome}
function frame(title,body,progress=''){app.innerHTML=`<section class="panel"><div class="gamehead"><button class="secondary" id="home">← Game menu</button><strong>${title}</strong><span class="pill">${session?.score||0} ⭐</span></div>${progress?`<div class="progress"><div style="width:${progress}%"></div></div>`:''}${body}</section>`;$('#home').onclick=()=>{audio('tap');menu()}}
function start(g){audio('tap');game=g;round++;const all=shuffle(ids());const count=g==='memory'?Math.min(6,all.length):g==='builder'?Math.min(8,all.length):Math.min(10,all.length);session={order:all.slice(0,count),at:0,score:0,missed:[],done:false,locked:false,hint:0,attempt:0,flip:[],matched:[],pairCount:0,letters:[],chosen:[],tries:0};if(g==='memory')prepareMemory();if(g==='wheel'){session.wheelPhase='ready';session.wheelRotation=0;session.wheelQuestion=null;session.wheelTotal=0;session.wheelResult='';session.wheelLock=false;session.wheelCategory='';session.wheelSpins=0}render()}
function advance(){session.at++;session.locked=false;session.hint=0;session.attempt=0;session.chosen=[];session.tries=0;if(session.at>=session.order.length){finish();return}render()}
function correct(points=3){audio('good');streak++;session.score+=points;award(points*2);updateStats()}
function incorrect(){audio('bad');streak=0;updateStats();const id=session.order[session.at];if(!session.missed.includes(id))session.missed.push(id)}
function finish(){audio('win');celebrate();const count=session.order.length;frame('🎉 Adventure complete!',`<div class="end"><div class="big">🏆</div><h2>Fantastic effort, Riki!</h2><p>You finished <strong>${count}</strong> words!</p><div class="reward"><span>🌟</span><span>💎</span><span>🎀</span></div><h2>${session.score} stars earned</h2><p>🪙 Your treasure vault has <strong>${coins}</strong> coins.</p><p><button class="primary" id="houseAfter">🛍️ Spend coins at my dollhouse!</button></p>${session.missed.length?`<div class="hintbox">💡 Keep practicing: ${session.missed.map(i=>`<span dir="rtl">${W[i][0]}</span> (${W[i][1]})`).join(' · ')}</div>`:'<div class="feedback good">✨ You solved every word without a wrong answer!</div>'}<div class="row" style="justify-content:center"><button class="primary" id="again">🔁 Play again</button><button class="secondary" id="tomenu">🎮 Game menu</button></div></div>`,'100');$('#again').onclick=()=>start(game);$('#tomenu').onclick=menu;$('#houseAfter').onclick=houseHome}
function render(){if(game==='detective')detective();if(game==='memory')memory();if(game==='bubbles')bubbles();if(game==='builder')builder();if(game==='sort')sort();if(game==='wheel')wheel()}
function optionsFor(id,n=4,reverse=false){const arr=shuffle(ids().filter(i=>i!==id&&(reverse||W[i][1]!==W[id][1])));const chosen=[];for(const i of arr){if(reverse||!chosen.some(j=>W[j][1]===W[i][1]))chosen.push(i);if(chosen.length>=n-1)break}return shuffle([id,...chosen])}
function detective(){const s=session,id=s.order[s.at],w=W[id],opts=s.opts||(s.opts=optionsFor(id));frame('🔎 Mystery Detective',`<p class="subtle">Mystery ${s.at+1} / ${s.order.length} · Earn up to 3 stars!</p><div class="prompt"><div class="eyebrow">🕵️ WHO AM I?</div><div class="meaning">${esc(w[1])}</div><p>Find the matching Hebrew shoresh!</p>${s.hint>0?`<div class="hintbox">💡 ${esc(w[2])}</div>`:''}${s.hint>1?`<div class="hintbox">🔤 Starts with <strong dir="rtl">${w[0][0]}</strong></div>`:''}</div><div class="options">${opts.map(i=>`<button class="option he" data-choice="${i}" ${s.locked?'disabled':''}>${W[i][0]}</button>`).join('')}</div><div id="result"></div><div class="foot"><button class="secondary" id="clue" ${s.hint>=2||s.locked?'disabled':''}>💡 ${s.hint?'Another clue':'Give me a clue'}</button><span class="subtle">Hints are always okay!</span></div>`,100*s.at/s.order.length);$('#clue').onclick=()=>{s.hint++;audio('tap');detective()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(s.locked)return;const picked=Number(b.dataset.choice);if(picked===id){s.locked=true;correct(Math.max(1,3-s.hint));b.classList.add('correct');document.querySelectorAll('[data-choice]').forEach(x=>x.disabled=true);$('#result').innerHTML=`<div class="feedback good">🌟 Mystery solved! ${w[0]} = ${esc(w[1])}</div><button class="primary" id="next">Next mystery →</button>`;$('#next').onclick=()=>{s.opts=null;advance()}}else{incorrect();b.classList.add('wrong');b.disabled=true;$('#result').innerHTML=`<div class="feedback try">💜 Not this one. Try another root!</div>`}})}
function prepareMemory(){const s=session;s.pairs=s.order.map((id,k)=>[{id,kind:'he',key:k},{id,kind:'en',key:k}]).flat();s.cards=shuffle(s.pairs);s.flip=[];s.matched=[];s.pairCount=0}
function memory(){const s=session;frame('🃏 Magic Memory',`<p class="subtle">Find all ${s.order.length} pairs · Match a Hebrew word to its English meaning</p><div class="progress"><div style="width:${s.pairCount/s.order.length*100}%"></div></div><div class="memory">${s.cards.map((c,i)=>{const open=s.flip.includes(i)||s.matched.includes(c.key);return `<button class="tile ${open?'open':''} ${s.matched.includes(c.key)?'matched':''}" data-tile="${i}" ${s.matched.includes(c.key)?'disabled':''}>${open?`<span class="${c.kind==='he'?'he':'tiny'}">${esc(c.kind==='he'?W[c.id][0]:(c.id===17?'Tell (a story)':c.id===4?'Tell (someone)':W[c.id][1]))}</span>`:'✨'}</button>`}).join('')}</div><p class="subtle">Pairs found: ${s.pairCount} / ${s.order.length}</p><div id="memmessage" class="feedback" style="display:none"></div>`,s.pairCount/s.order.length*100);document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.tile);if(s.locked||s.flip.includes(i)||s.matched.includes(s.cards[i].key))return;s.flip.push(i);audio('tap');b.classList.add('open');const c=s.cards[i];b.innerHTML=`<span class="${c.kind==='he'?'he':'tiny'}">${esc(c.kind==='he'?W[c.id][0]:(c.id===17?'Tell (a story)':c.id===4?'Tell (someone)':W[c.id][1]))}</span>`;if(s.flip.length===2){const [a,z]=s.flip.map(j=>s.cards[j]);if(a.key===z.key){s.matched.push(a.key);s.pairCount++;correct(2);s.flip=[];setTimeout(()=>{if(game!=='memory'||session!==s)return;if(s.pairCount===s.order.length)finish();else memory()},450)}else{s.locked=true;incorrect();$('#memmessage').style.display='block';$('#memmessage').textContent='Look closely and remember where the cards are!';setTimeout(()=>{if(game!=='memory'||session!==s)return;s.flip=[];s.locked=false;memory()},1050)}}})}
function bubbles(){const s=session,id=s.order[s.at],w=W[id];s.opts=s.opts||optionsFor(id,3);frame('🫧 Bubble Pop',`<p class="subtle">Bubble ${s.at+1} / ${s.order.length}</p><div class="prompt"><div class="eyebrow">🫧 POP THE RIGHT MEANING!</div><div class="hebrew">${w[0]}</div></div><div class="bubblefield">${s.opts.map((i,k)=>`<button class="bubble" data-bubble="${i}" style="background-color:${['#ffd0e8','#c3eaff','#d8cbff'][k]}" ${s.locked?'disabled':''}>${esc(W[i][1])}</button>`).join('')}</div><div id="result"></div><div class="foot"><button class="secondary" id="hint">💡 Show memory clue</button><span class="subtle">Pop and collect stars!</span></div>`,100*s.at/s.order.length);$('#hint').onclick=()=>{$('#result').innerHTML=`<div class="hintbox">${esc(w[2])}</div>`;audio('tap')};document.querySelectorAll('[data-bubble]').forEach(b=>b.onclick=()=>{if(s.locked)return;const pick=Number(b.dataset.bubble);if(pick===id){s.locked=true;correct(3);b.classList.add('pop');$('#result').innerHTML=`<div class="feedback good">POP! 🎉 ${w[0]} means ${esc(w[1])}!</div><button class="primary" id="next">Next bubbles →</button>`;$('#next').onclick=()=>{s.opts=null;advance()}}else{incorrect();b.classList.add('wrong');b.disabled=true;$('#result').innerHTML='<div class="feedback try">Oops! That bubble was a decoy. Try again! 💜</div>'}})}

// The wheel teaches grammatical word parts, not just bare root translations.
// Prefixes are practiced on recognizable words; suffixes are shown on simple nouns.
const PREFIXES=[
 {a:'ו',meaning:'And',word:'ושלח',base:'שלח',explain:'ו at the front often means AND. ושלח = and sent.'},
 {a:'ב',meaning:'In / At',word:'בבית',base:'בית',explain:'ב at the front often means IN or AT. בבית = in the house.'},
 {a:'ל',meaning:'To / For',word:'לבית',base:'בית',explain:'ל at the front often means TO or FOR. לבית = to the house.'},
 {a:'מ',meaning:'From',word:'מבית',base:'בית',explain:'מ at the front often means FROM. מבית = from a house.'},
 {a:'כ',meaning:'Like / As',word:'כמלך',base:'מלך',explain:'כ at the front often means LIKE or AS. כמלך = like a king.'},
 {a:'ה',meaning:'The',word:'הבית',base:'בית',explain:'ה at the front often means THE. הבית = the house.'},
 {a:'ש',meaning:'That / Which',word:'שאמר',base:'אמר',explain:'ש at the front can mean THAT. שאמר = that he said.'}
];
const SUFFIXES=[
 {a:'י',meaning:'My',word:'ספרי',base:'ספר',explain:'י at the end of a noun can mean MY. ספרי = my book.'},
 {a:'ו',meaning:'His',word:'ספרו',base:'ספר',explain:'ו at the end of a noun can mean HIS. ספרו = his book.'},
 {a:'ה',meaning:'Her',word:'ספרה',base:'ספר',explain:'ה at the end of a noun can mean HER. ספרה = her book.'},
 {a:'נו',meaning:'Our',word:'ספרנו',base:'ספר',explain:'נו at the end of a noun can mean OUR. ספרנו = our book.'},
 {a:'ם',meaning:'Their',word:'ספרם',base:'ספר',explain:'ם at the end of a noun can mean THEIR (masculine plural). ספרם = their book.'},
 {a:'ך',meaning:'Your',word:'ספרך',base:'ספר',explain:'ך at the end of a noun can mean YOUR. The vowel changes depending on who is addressed.'}
];
const PARTS=['And','In / At','To / For','From','Like / As','The','That / Which','My','His','Her','Our','Their','Your'];
const WHEEL_SEGMENTS=[['🔗 AND','prefix',0],['🌸 PREFIX','prefix',1],['🎀 SUFFIX','suffix',0],['💎 SUFFIX','suffix',1],['🌈 MIX IT','mixed',0],['⭐ BONUS','mixed',1]];
function pickWheelQuestion(category){const list=category==='prefix'?PREFIXES:category==='suffix'?SUFFIXES:[...PREFIXES,...SUFFIXES];const obj=list[Math.floor(Math.random()*list.length)],type=PREFIXES.includes(obj)?'prefix':'suffix';let opts=shuffle([obj.meaning,...shuffle(PARTS.filter(x=>x!==obj.meaning)).slice(0,3)]);return {...obj,type,opts}}
function wheel(){const s=session;let isReady=s.wheelPhase==='ready',isSpinning=s.wheelPhase==='spinning',q=s.wheelQuestion;frame('🎡 Spin the Word Wheel',`<div class="wheel-layout"><div><div class="wheel-wrap"><div class="wheel-pointer">▼</div><div class="wheel" id="wordWheel" style="transform:rotate(${s.wheelRotation}deg)">${WHEEL_SEGMENTS.map((x,i)=>`<span class="wheel-label">${x[0]}</span>`).join('')}</div></div><div style="text-align:center;margin-top:17px"><span class="wheel-tag">🎯 ${s.wheelSpins} spins · ⭐ ${s.score} stars</span></div></div><div>${isReady||isSpinning?`<div class="wheel-question"><div style="font-size:48px">🎡✨</div><h2>${isSpinning?'Where will it land?':'Spin for your next Hebrew challenge!'}</h2><p>Practice prefixes (letters at the front) and suffixes (letters at the end). Every correct answer earns coins for your dollhouse!</p><button class="primary" id="spinButton" ${isSpinning?'disabled':''}>${isSpinning?'🎠 Spinning…':'🎡 SPIN THE WHEEL!'}</button></div>`:`<div class="wheel-question"><span class="wheel-tag">${q.type==='prefix'?'🌸 Prefix at the FRONT':'🎀 Suffix at the END'}</span><div class="partword"><span class="${q.type==='prefix'?'affix':'stem'}" dir="rtl">${esc(q.type==='prefix'?q.a:q.base)}</span><span class="${q.type==='suffix'?'suffix':'stem'}" dir="rtl">${esc(q.type==='suffix'?q.a:q.base)}</span></div><p style="font-size:17px;font-weight:800">What does the highlighted <strong>${q.type==='prefix'?'beginning':'ending'}</strong> mean?</p><div class="wheel-answer">${q.opts.map((o,i)=>`<button data-wheel-answer="${i}" class="${s.wheelResult&&o===q.meaning?'correct':''} ${s.wheelResult==='wrong'&&s.wheelPicked===o?'wrong':''}" ${s.wheelLock?'disabled':''}>${esc(o)}</button>`).join('')}</div>${s.wheelResult?`<div class="wheel-info"><strong>${s.wheelResult==='correct'?'🌟 Correct!':'💜 Good try!'} ${esc(q.meaning)}</strong><p>${esc(q.explain)}</p></div><button class="primary" id="spinAgain">🎡 Spin again!</button>`:`<p class="subtle">💡 The colorful part is the clue. No timer!</p>`}</div>`}</div></div><div class="wheel-info"><strong>🧠 Hebrew word trick:</strong> The same letter can mean different things depending on where it appears. <strong>ו</strong> at the beginning often means <strong>and</strong>, while <strong>ו</strong> at the end of a noun can mean <strong>his</strong>. These are beginner examples; word endings also change in verbs.</div><div class="row" style="justify-content:center"><button class="secondary" id="wheelHouse">🏠 Spend my coins</button><button class="secondary" id="wheelMenu">🎮 Other games</button></div>`,Math.min(100,s.wheelSpins*10));$('#wheelHouse').onclick=houseHome;$('#wheelMenu').onclick=menu;
if(isReady){$('#spinButton').onclick=()=>{if(s.wheelPhase!=='ready')return;audio('tap');s.wheelPhase='spinning';s.wheelResult='';const slot=Math.floor(Math.random()*6);s.wheelCategory=WHEEL_SEGMENTS[slot][1];s.wheelQuestion=pickWheelQuestion(s.wheelCategory);const from=s.wheelRotation;const to=from+1800+((6-slot)%6)*60+30-(from%360);s.wheelSpins++;s.wheelRotation=from;wheel();const disc=document.getElementById('wordWheel');if(disc){disc.style.transition='none';disc.style.transform=`rotate(${from}deg)`;requestAnimationFrame(()=>requestAnimationFrame(()=>{disc.style.transition='transform 3.5s cubic-bezier(.12,.75,.12,1)';disc.style.transform=`rotate(${to}deg)`;}))}s.wheelRotation=to;setTimeout(()=>{if(game!=='wheel'||session!==s||s.wheelPhase!=='spinning')return;s.wheelPhase='question';audio('win');wheel()},3550)}}
if(q&&!isReady&&!isSpinning){document.querySelectorAll('[data-wheel-answer]').forEach(b=>b.onclick=()=>{if(s.wheelLock)return;const picked=q.opts[Number(b.dataset.wheelAnswer)];s.wheelPicked=picked;s.wheelResult=picked===q.meaning?'correct':'wrong';s.wheelLock=true;if(s.wheelResult==='correct'){correct(4);celebrate()}else incorrectWheel();wheel()});if(s.wheelResult)$('#spinAgain').onclick=()=>{s.wheelPhase='ready';s.wheelLock=false;s.wheelQuestion=null;s.wheelResult='';audio('tap');wheel()}}
}

ctibles.':'✨ Mirror, mirror! Your room looks lovely!';audio('tap')};$('#lifeBed').onclick=()=>{$('#lifeFeedback').textContent='✨ You tidied up the room!';audio('good')};$('#lifeParty').onclick=()=>{living.party=!living.party;saveLiving();celebrate();showLivingHouse()};$('#lifeFish').onclick=()=>{$('#lifeFeedback').textContent='🐠 '+((living.fish||[]).join(' ')||'Rescue fish in Aquarium Rescue to fill your tank!')};$('#lifeShop').onclick=houseHome}

<script>
(function(){
  // Pointer Events work with a mouse, stylus and touch. The original tap controls remain available.
  let drag=null,ghost=null,over=null;
  const sourceSel='[data-life-item],[data-life-shelf],[data-drawer-object],[data-select],[data-item-slot],[data-extra-choice]';
  function targetFor(source){
    if(source.matches('[data-extra-choice]'))return '.extra-stage';
    if(source.matches('[data-select],[data-item-slot]'))return '[data-slot],[data-item-slot]';
    return '[data-life-shelf],[data-life-drawer]';
  }
  function label(el){return (el.innerText||el.textContent||'✨').trim().slice(0,65)}
  document.addEventListener('pointerdown',function(e){
    if(e.button!==0||drag)return;
    const el=e.target.closest(sourceSel);if(!el||el.disabled)return;
    drag={source:el,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,selector:targetFor(el)};
  },true);
  document.addEventListener('pointermove',function(e){
    if(!drag||drag.id!==e.pointerId)return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<9)return;
    if(!drag.moved){
      drag.moved=true;ghost=document.createElement('div');ghost.className='drag-float';ghost.textContent=label(drag.source);document.body.appendChild(ghost);
    }
    if(e.cancelable)e.preventDefault();
    ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';

    if(source.matches('[data-life-item],[data-life-shelf],[data-drawer-object]')){

function storageModal(id){if(!ownedItem(id)||!Object.values(decor[currentRoom]||{}).includes(id))return;openStorage=id;const key=storageKey(currentRoom,id),contents=dreamStorage[key]||[],it=roomObject(id),capacity=id.startsWith('dresser')?6:id.startsWith('shelf')?9:4;const wrap=document.createElement('div');wrap.className='storage-overlay';wrap.innerHTML=`<div class="storage-dialog" role="dialog" aria-modal="true"><button id="closeStorage" class="close-storage">✕ Close</button><h2>${it[1]} ${esc(it[2])}</h2><p>Drag a purchased treasure into a space, or tap a treasure then a space. Tap a stored item to take it back.</p><div class="storage-spaces ${id.startsWith('dresser')?'drawers':''}">${Array.from({length:capacity},(_,i)=>`<button data-storage-slot="${i}" class="storage-space" title="Storage space ${i+1}">${contents[i]?miniArt(contents[i]):'<span class="empty-space">＋</span>'}</button>`).join('')}</div><h3>My purchased little treasures</h3><div class="storage-available">${ITEMS.filter(x=>SMALL_IDS.includes(x[0])&&ownedItem(x[0])).map(x=>`<button data-store-mini="${x[0]}" class="${selectedMini===x[0]?'active':''}">${miniArt(x[0])}<small>${esc(x[2])}</small></button>`).join('')||'<p>Buy miniature accessories in the shop first.</p>'}</div><p class="storage-status" id="storageStatus">${selectedMini?'Selected: '+roomObject(selectedMini)?.[2]:'Choose a little treasure to store.'}</p></div>`;document.body.appendChild(wrap);const close=()=>{wrap.remove();openStorage=''};wrap.querySelector('#closeStorage').onclick=close;wrap.addEventListener('click',e=>{if(e.target===wrap)close()});wrap.querySelectorAll('[data-store-mini]').forEach(b=>{b.onclick=()=>{selectedMini=b.dataset.storeMini;wrap.querySelectorAll('[data-store-mini]').forEach(x=>x.classList.toggle('active',x===b));wrap.querySelector('#storageStatus').textContent='Now choose an empty space for '+roomObject(selectedMini)[2]};setupPointerDrag(b,(e)=>{const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(' function setupPointerDrag(el,onDrop){let drag=null,ghost=null;el.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,started:false};});const move=e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.started&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;if(!drag.started){drag.started=true;ghost=el.cloneNode(true);ghost.className='dream-ghost';document.body.appendChild(ghost)}e.preventDefault();ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'};const end=e=>{if(!drag||drag.id!==e.pointerId)return;const was=drag.started;drag=null;ghost?.remove();ghost=null;if(was)onDrop(e)};el.addEventListener('pointermove',move,{passive:false});el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{drag=null;ghost?.remove();ghost=null})}

{if(!selectedItem)return;const placements=decor[currentRoom]||{};for(const k of Object.keys(placements))if(placements[k]===selectedItem)delete placements[k];decor[currentRoom]=placements;saveHouse();selectedItem='';dreamMessage='Returned to your collection. You still own it!';houseRender()};document.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>{wallColors[currentRoom]=b.dataset.wall;saveHouse();houseRender()})}

function drawTalk(){const t=talks[dialogueStep%talks.length],used=dialogueTokens;const opts=[...t.pieces,...t.extras].sort((a,b)=>a.length-b.length);shell('💬 Conversation Builder',`${stage(t.s)}<h2 class="sel-title">Build what you'd say</h2><p style="text-align:center">Tap the sentence pieces in a natural order. You can undo a piece.</p><div class="sel-stage"><strong>My response:</strong><div class="sel-tiles">${used.length?used.map((v,i)=>`<button class="sel-tile" data-undo="${i}">${v} ↩</button>`).join(''):'<span style="opacity:.6">Your words will appear here…</span>'}</div></div><div class="sel-tiles">${opts.map((v,i)=>`<button class="sel-tile" data-piece="${i}" ${used.includes(v)?'disabled':''}>${v}</button>`).join('')}</div><p class="sel-status" id="talkFeedback">Scene ${dialogueStep%talks.length+1} of ${talks.length}</p><div class="sel-tools"><button class="secondary" id="talkClear">Clear</button><button class="sel-big-btn" id="talkCheck">Check my conversation</button></div>`);document.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{dialogueTokens.push(opts[Number(b.dataset.piece)]);audio('tap');drawTalk()});document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{dialogueTokens.splice(Number(b.dataset.undo),1);drawTalk()});$id('talkClear').onclick=()=>{dialogueTokens=[];drawTalk()};$id('talkCheck').onclick=()=>{if(JSON.stringify(dialogueTokens)===JSON.stringify(t.pieces)){audio('good');$id('talkFeedback').textContent='🌟 That sounds natural and respectful!';$id('talkCheck').textContent='Next conversation →';$id('talkCheck').onclick=()=>{dialogueStep++;dialogueTokens=[];drawTalk()}}else{$id('talkFeedback').textContent='💡 Try making one complete response: start politely, explain, then make a request. You can move pieces by tapping them.';audio('tap')}}}

function dragTiles(selector,done){document.querySelectorAll(selector).forEach(el=>{el.addEventListener('pointerdown',e=>{if(e.button!==0)return;const startX=e.clientX,startY=e.clientY;let ghost=null;const move=ev=>{if(!ghost&&Math.hypot(ev.clientX-startX,ev.clientY-startY)>9){ghost=el.cloneNode(true);ghost.style.cssText='position:fixed;z-index:99999;pointer-events:none;width:180px;opacity:.9;left:0;top:0';document.body.appendChild(ghost)}if(ghost){ev.preventDefault();ghost.style.transform=`translate(${ev.clientX-90}px,${ev.clientY-35}px)`;document.querySelectorAll('[data-feeling]').forEach(b=>{const r=b.getBoundingClientRect();b.classList.toggle('hover',ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)})}};const up=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);ghost?.remove();document.querySelectorAll('[data-feeling]').forEach(b=>{const r=b.getBoundingClientRect();b.classList.remove('hover');if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)done(b.dataset.feeling)})};el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})})}

    if(/bunk|loft/.test(n)){for(let z of [1.5,2,2.5])box(x+1.3,y-.7,z,.11,.15,.09,'#c89a7a')}
  }else if(/sofa|couch|loveseat|chair|throne|armchair|booth/.test(n)){
    let w=/sofa|couch|loveseat|booth/.test(n)?2.55:1.16;
    for(let a=-w/2+.3;a<w/2;a+=.52){box(x+a,y-.42,1.01,.45,.72,.19,'#fff1e9');pearl(x+a+.2,y+.42,1.55,.18,'#fff4ec')}
    if(/cloud/.test(n)){for(let a=-w/2;a<=w/2;a+=.45)pearl(x+a,y+.43,1.8,.34,'#fff8fb')}
    if(/shell|mermaid/.test(n)){for(let a=-w/2+.2;a<w/2;a+=.24)pearl(x+a,y+.47,1.8+Math.cos(a*2)*.3,.23,'#f3d6ec')}
    if(/royal|throne|princess/.test(n)){for(let a of [-w/2+.1,w/2-.1])pearl(x+a,y+.45,2.15,.16,'#e6c06c')}
  }else if(/table|desk|island/.test(n)){
    for(let i=0;i<4;i++){let a=i*Math.PI/2;pearl(x+Math.cos(a)*.52,y+Math.sin(a)*.4,1.68,.11,'#f4c6d0')}
    if(/tea|cafe|diner/.test(n)){cylinder(x,y,1.58,.38,.12,'#f9f5ea');cylinder(x-.12,y,1.7,.12,.19,'#f2c9ce');cylinder(x+.2,y,1.7,.13,.18,'#e5d3ae')}
  }else if(/shelf|dresser|vanity|cabinet|wardrobe|bookcase/.test(n)){
    for(let i=0;i<3;i++){box(x-.76,y-.57,.32+i*.85,1.55,.08,.08,'#fff3e8');for(let k=0;k<3;k++){box(x-.65+k*.4,y-.59,.52+i*.85,.28,.08,.42,['#e9b6be','#b7d5d1','#e3d2ad'][(i+k)%3])}}
    if(/vanity/.test(n)){box(x-.62,y-.62,3.15,1.24,.15,1.3,'#e0b8c6');box(x-.5,y-.72,3.27,1,.08,1.05,'#d8edf0');for(let i=0;i<5;i++)pearl(x-.55+i*.26,y-.77,4.45,.09,'#fff2bc')}
  }else if(/plant|flower|tree/.test(n)){for(let i=0;i<6;i++)floral(x+Math.cos(i)*.35,y+Math.sin(i)*.35,.6,.48,i%2?'#f1a7c7':'#f1db94')}
}

function draw(){canvas=document.getElementById('riki3d');if(!canvas)return;ctx=canvas.getContext('2d');let dpr=Math.min(devicePixelRatio||1,2),rect=canvas.getBoundingClientRect();if(!rect.width)return;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(canvas.width/1000,0,0,canvas.height/650,0,0);let bg=ctx.createLinearGradient(0,0,0,650);bg.addColorStop(0,'#d6e9fa');bg.addColorStop(1,'#fce3d4');ctx.fillStyle=bg;ctx.fillRect(0,0,1000,650);let halo=ctx.createRadialGradient(520,180,80,520,300,670);halo.addColorStop(0,'#ffffff55');halo.addColorStop(1,'#d9b4d300');ctx.fillStyle=halo;ctx.fillRect(0,0,1000,650);sceneItems=[];artRoom();extraArchitecture();deluxeArchitecture();wallPattern3D();let placements=decor[currentRoom]||{},positions=dreamPosition[currentRoom]||{};let picks=[];for(const [slot,id] of Object.entries(placements)){if(!ownedItem(id))continue;let pos=positions[id]||SLOTS[Number(slot)]||{x:45,y:72};let x=clamp((pos.x-50)/6,-4.8,4.8),y=clamp((pos.y-55)/5.5,-3.7,3.7);furniture(id,x,y);extraFurniture(id,x,y);deluxeFurniture(id,x,y);let q=project([x,y,1.2]);picks.push({id,x:q.x,y:q.y})}sceneItems.sort((a,b)=>b.depth-a.depth);for(let f of sceneItems){polygon(f.points,f.color,'#493b4125');let pts=f.points.map(project),minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));if(maxX-minX>5&&maxY-minY>5){ctx.save();ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.clip();let g=ctx.createLinearGradient(minX,minY,maxX,maxY);g.addColorStop(0,'#ffffff25');g.addColorStop(.48,'#ffffff06');g.addColorStop(1,'#25152e24');ctx.fillStyle=g;ctx.fillRect(minX,minY,maxX-minX,maxY-minY);ctx.restore()}}
// Highlight selectable items with unobtrusive nameplates.
ctx.textAlign='center';ctx.font='bold 15px system-ui';for(let pick of picks){let it=ITEMS.find(t=>t[0]===pick.id);if(!it)continue;let name=it[2].slice(0,18),w=Math.min(185,ctx.measureText(name).width+20);ctx.fillStyle=activeId===pick.id?'#ffe2a9ee':'#fffaf1dd';ctx.beginPath();ctx.roundRect(pick.x-w/2,pick.y-46,w,25,12);ctx.fill();ctx.fillStyle='#654d60';ctx.fillText(name,pick.x,pick.y-28)}canvas._picks=picks;
}
function eventPct(e){const r=canvas.getBoundingClientRect();return {x:clamp((e.clientX-r.left)/r.width*100,8,92),y:clamp((e.clientY-r.top)/r.height*100,26,86)}}
function pickItem(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1000,y=(e.clientY-r.top)/r.height*650;return (canvas._picks||[]).slice().reverse().find(p=>Math.hypot(p.x-x,p.y-y)<67)?.id||null}
function bind3d(){oldDreamBind();canvas=document.getElementById('riki3d');if(!canvas)return;draw();
canvas.addEventListener('pointerdown',e=>{mouseStart={x:e.clientX,y:e.clientY,id:pickItem(e),moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!mouseStart)return;let dx=e.clientX-mouseStart.x,dy=e.clientY-mouseStart.y;if(Math.hypot(dx,dy)>10)mouseStart.moved=true;if(mouseStart.moved&&!mouseStart.id){orbit=clamp(orbit+dx*.004,-.55,.65);mouseStart.x=e.clientX;mouseStart.y=e.clientY;draw()}});
canvas.addEventListener('pointerup',e=>{if(!mouseStart)return;let m=mouseStart;mouseStart=null;if(m.id&&m.moved){let p=eventPct(e);placeDream(m.id,p.x,p.y)}else if(m.id){activeId=m.id;selectedItem=m.id;let msg=document.getElementById('dreamMessage');if(msg)msg.textContent='Selected '+(ITEMS.find(t=>t[0]===m.id)?.[2]||'furniture')+'. Tap a new spot to move it, or tap Open for storage.';draw()}else if(!m.moved&&selectedItem){let p=eventPct(e);placeDream(selectedItem,p.x,p.y)}else{localStorage.setItem('riki3dOrbit',orbit);draw()}});
canvas.addEventListener('click',e=>e.stopPropagation());
const left=document.getElementById('orbitLeft'),right=document.getElementById('orbitRight'),reset=document.getElementById('orbitReset');if(left)left.onclick=()=>{orbit=clamp(orbit-.18,-.55,.65);draw()};if(right)right.onclick=()=>{orbit=clamp(orbit+.18,-.55,.65);draw()};if(reset)reset.onclick=()=>{orbit=0;draw()};
const open=document.getElementById('openSelected');if(open)open.onclick=()=>{if(activeId&&isStorage(activeId))storageModal(activeId);else{let msg=document.getElementById('dreamMessage');if(msg)msg.textContent='Select a purchased shelf, vanity or dresser to open it.'}};
window.addEventListener('resize',draw,{once:true});
}
dreamHtml=function(){let html=oldDreamHtml();let start=html.indexOf('<div class="dream-room '),end=html.indexOf('<div class="dream-message"',start);if(start<0||end<0)return html;let stage=`<div class="dream-room dream3d" id="dreamRoom"><canvas id="riki3d" aria-label="Rotatable three dimensional ${currentRoom} dollhouse; tap to place furniture" role="img"></canvas><div class="riki3d-hud"><span>🏡 ${palette[currentRoom]?.name||'Dream room'} · 3D</span><span>👆 Drag to explore · tap to decorate</span></div></div><div class="riki3d-actions"><button id="orbitLeft">↶ Turn left</button><button id="orbitRight">↷ Turn right</button><button id="orbitReset">⌂ Front view</button><button id="openSelected">🗄️ Open selected storage</button></div><p class="riki3d-legend">Tap a purchased item below, then tap the room to place it. Drag furniture to move it. Drag empty space to rotate the room.</p>`;return html.slice(0,start)+stage+html.slice(end)};
dreamBind=bind3d;decorateHtml=dreamHtml;bindDecor=dreamBind;
})();
