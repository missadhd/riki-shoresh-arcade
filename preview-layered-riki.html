<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layered Riki animation preview</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff4f8,#eeeaff);font:700 16px system-ui;color:#5a3549;display:grid;place-items:center}.card{width:min(94vw,680px);padding:18px;background:#fffafd;border:3px solid #efc2d5;border-radius:28px;box-shadow:0 18px 50px #8d42682b}.back{color:#a53764;text-decoration:none}.top{text-align:center}.top h1{margin:10px 0 4px;color:#d53772;font-size:clamp(25px,6vw,38px)}.top p{margin:5px auto 14px;max-width:570px;line-height:1.35}.stage{height:min(64vh,570px);min-height:430px;position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 50% 30%,#fff 0,#fff0f6 55%,#e9e1ff 100%)}.doll{position:absolute;inset:0;display:grid;place-items:center}.doll img{position:absolute;width:auto;height:95%;max-width:96%;object-fit:contain;opacity:0;transition:opacity 48ms linear;filter:drop-shadow(0 12px 10px #713c5630);transform-origin:50% 88%}.doll img.on{opacity:1}.doll.speaking img.on{animation:breath 1.8s ease-in-out infinite alternate}@keyframes breath{from{transform:rotate(-.15deg)}to{transform:rotate(.22deg)}}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:14px}button{border:0;border-radius:999px;padding:12px 18px;background:#d83c76;color:white;font-weight:900;font-size:15px;box-shadow:0 4px 0 #a12958;cursor:pointer}button.alt{background:#8069ca;box-shadow:0 4px 0 #59489a}.status{text-align:center;min-height:24px;margin:12px 0 0;color:#936078}@media(prefers-reduced-motion:reduce){.doll img{transition:none}.doll.speaking img.on{animation:none}}</style></head><body><main class="card"><a class="back" href="./">← Back to the arcade</a><div class="top"><h1>Layered Riki animation test</h1><p>This uses rendered frames in the approved soft 3D doll style. There is no painted mouth patch and no procedural Blender character.</p></div><div class="stage"><div class="doll" id="doll"><img class="on" data-frame="closed" src="assets/images/dolls/riki-talk-closed.webp?v=layered-1" alt="Riki"><img data-frame="small" src="assets/images/dolls/riki-talk-small.webp?v=layered-1" alt=""><img data-frame="wide" src="assets/images/dolls/riki-talk-wide.webp?v=layered-1" alt=""><img data-frame="blink" src="assets/images/dolls/riki-talk-blink.webp?v=layered-1" alt=""></div></div><div class="controls"><button id="talk">▶ Hear Riki talk</button><button class="alt" data-show="closed">Closed</button><button class="alt" data-show="small">Small sound</button><button class="alt" data-show="wide">Wide sound</button><button class="alt" data-show="blink">Blink</button></div><p class="status" id="status">Rendered animation ready.</p></main><script>(()=>{const doll=document.getElementById('doll'),status=document.getElementById('status'),frames=[...doll.querySelectorAll('[data-frame]')];let speaking=false,blinkTimer;function show(name){frames.forEach(x=>x.classList.toggle('on',x.dataset.frame===name));status.textContent={closed:'Natural closed expression',small:'Small speech sound',wide:'Wide speech sound',blink:'Natural blink'}[name]}function scheduleBlink(){clearTimeout(blinkTimer);blinkTimer=setTimeout(()=>{if(!speaking){show('blink');setTimeout(()=>{show('closed');scheduleBlink()},125)}else scheduleBlink()},2800+Math.random()*2200)}document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>show(b.dataset.show));document.getElementById('talk').onclick=()=>{try{speechSynthesis.cancel();speaking=true;doll.classList.add('speaking');const u=new SpeechSynthesisUtterance('Hi! I look like the doll you chose, and these are real rendered speaking expressions.');u.pitch=1.16;u.rate=.92;const sounds=['small','closed','small','wide','small','closed','wide','small'];let i=0,t=setInterval(()=>show(sounds[i++%sounds.length]),115);u.onend=u.onerror=()=>{clearInterval(t);speaking=false;doll.classList.remove('speaking');show('closed');scheduleBlink()};speechSynthesis.speak(u);status.textContent='Riki is speaking…'}catch(e){status.textContent='Use the expression buttons to preview each frame.'}};Promise.all(frames.map(x=>x.decode?.().catch(()=>{})||Promise.resolve())).then(()=>status.textContent='Rendered animation ready.');scheduleBlink()})();</script></body></html>
