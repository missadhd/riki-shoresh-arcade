<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smooth Riki speaking preview</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff4f8,#eeeaff);font:700 16px system-ui;color:#5a3549;display:grid;place-items:center}.card{width:min(94vw,680px);padding:18px;background:#fffafd;border:3px solid #efc2d5;border-radius:28px;box-shadow:0 18px 50px #8d42682b}.back{color:#a53764;text-decoration:none}.top{text-align:center}.top h1{margin:10px 0 4px;color:#d53772;font-size:clamp(25px,6vw,38px)}.top p{margin:5px auto 14px;max-width:570px;line-height:1.35}.stage{height:min(64vh,570px);min-height:430px;position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 50% 30%,#fff 0,#fff0f6 55%,#e9e1ff 100%)}.doll{position:absolute;inset:0;display:grid;place-items:center}.sprite{position:relative;height:95%;aspect-ratio:3/4;max-width:96%;filter:drop-shadow(0 12px 10px #713c5630)}.sprite img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.mouth{opacity:0;transform-origin:50% 43.75%;transition:opacity 140ms ease}.mouth.open{opacity:1}.sprite.speaking .mouth{opacity:1;animation:mouthMove .36s cubic-bezier(.45,0,.55,1) infinite alternate}@keyframes mouthMove{from{transform:scale(1,.88)}to{transform:scale(1.035,1.1)}}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:14px}button{border:0;border-radius:999px;padding:12px 18px;background:#d83c76;color:#fff;font-weight:900;font-size:15px;box-shadow:0 4px 0 #a12958;cursor:pointer}button.alt{background:#8069ca;box-shadow:0 4px 0 #59489a}.status{text-align:center;min-height:24px;margin:12px 0 0;color:#936078}@media(prefers-reduced-motion:reduce){.mouth{transition:none}.sprite.speaking .mouth{animation:none}}</style></head><body><main class="card"><a class="back" href="./">← Back to the arcade</a><div class="top"><h1>Smooth Riki speaking test</h1><p>There is one fixed doll and one fixed mouth layer. No facial frames switch, the character never resizes, and automatic blinking is off.</p></div><div class="stage"><div class="doll"><div class="sprite" id="sprite"><img class="base" src="assets/images/dolls/riki-talk-closed.webp?v=smooth-3" alt="Riki"><img class="mouth" id="mouth" src="assets/images/dolls/riki-mouth-small.webp?v=smooth-3" alt=""></div></div></div><div class="controls"><button id="talk">▶ Hear Riki talk</button><button class="alt" id="closed">Closed mouth</button><button class="alt" id="open">Open mouth</button></div><p class="status" id="status">Smooth animation ready.</p></main><script>(()=>{const sprite=document.getElementById('sprite'),mouth=document.getElementById('mouth'),status=document.getElementById('status');document.getElementById('closed').onclick=()=>{sprite.classList.remove('speaking');mouth.classList.remove('open');status.textContent='Natural closed expression'};document.getElementById('open').onclick=()=>{sprite.classList.remove('speaking');mouth.classList.add('open');status.textContent='One fixed rendered mouth layer'};document.getElementById('talk').onclick=()=>{try{speechSynthesis.cancel();mouth.classList.remove('open');sprite.classList.add('speaking');const u=new SpeechSynthesisUtterance('Hi! My picture stays completely still, and my mouth now moves smoothly without flipping between images.');u.pitch=1.16;u.rate=.92;u.onend=u.onerror=()=>{sprite.classList.remove('speaking');status.textContent='Smooth animation ready.'};speechSynthesis.speak(u);status.textContent='Riki is speaking smoothly…'}catch(e){status.textContent='Use the mouth buttons to preview the single layer.'}};Promise.all([...document.images].map(x=>x.decode?.().catch(()=>{})||Promise.resolve())).then(()=>status.textContent='Smooth animation ready.')})();</script></body></html>
