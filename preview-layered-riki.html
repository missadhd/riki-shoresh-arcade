<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riki — Layered Character Test</title>
<style>
:root{font-family:Nunito,ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#57364f;background:#fff5fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 5%,#fff 0,#fff6fb 42%,#f9e8f4 100%)}main{width:min(100%,840px);margin:auto;padding:18px}.card{background:#fff;border:1px solid #f1d6e8;border-radius:28px;box-shadow:0 18px 50px #be7da52b;overflow:hidden}.header{text-align:center;padding:18px 18px 4px}.header h1{font-size:clamp(22px,5vw,34px);margin:0}.header p{margin:7px auto 0;max-width:620px;line-height:1.35;color:#7a6073}.stage{position:relative;width:min(100%,450px);aspect-ratio:3/4;margin:0 auto;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.mouth,.blink{opacity:0}.mouth.on,.blink.on{opacity:1}.eyes.off,.closed.off{opacity:0}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 16px 22px}button{border:0;border-radius:999px;padding:12px 18px;min-height:46px;background:#f1d7e9;color:#56334d;font:800 15px inherit;cursor:pointer;box-shadow:inset 0 -2px #b7659633}button.primary{background:#db4f9c;color:#fff}button:focus-visible{outline:3px solid #7b3fff;outline-offset:2px}.proof{margin:0 18px 18px;padding:12px 15px;border-radius:16px;background:#fff7d7;font-size:14px;line-height:1.4}.proof b{color:#9a4b08}@media(max-width:520px){main{padding:8px}.card{border-radius:20px}.header{padding-top:14px}.stage{width:min(100%,380px)}.controls{padding-top:2px}button{flex:1 1 42%}}
</style></head><body><main><section class="card"><div class="header"><h1>Riki’s real layered face</h1><p>One fixed doll. The eyes and mouth are separate transparent pieces aligned to the same canvas.</p></div><div class="stage" aria-label="Layered Riki character preview">
<img class="layer" src="assets/characters/riki-layered/base.webp" alt="">
<img class="layer eyes" src="assets/characters/riki-layered/eye-left.webp" alt=""><img class="layer eyes" src="assets/characters/riki-layered/eye-right.webp" alt="">
<img class="layer blink" src="assets/characters/riki-layered/eyes-blink.webp" alt="">
<img class="layer closed" src="assets/characters/riki-layered/mouth-closed.webp" alt="">
<img class="layer mouth" data-mouth="small" src="assets/characters/riki-layered/mouth-small.webp" alt=""><img class="layer mouth" data-mouth="wide" src="assets/characters/riki-layered/mouth-wide.webp" alt=""><img class="layer mouth" data-mouth="o" src="assets/characters/riki-layered/mouth-o.webp" alt="">
</div><div class="controls"><button class="primary" id="talk">▶ Hear Riki talk</button><button id="blink">Blink once</button><button id="stop">Stop</button></div><div class="proof"><b>What changed:</b> her body, hair, head, and lighting never switch images. Only a small mouth layer changes while she speaks, and only the eye layer changes when she blinks.</div></section></main>
<script>
const mouths=[...document.querySelectorAll('.mouth')],closed=document.querySelector('.closed'),eyes=[...document.querySelectorAll('.eyes')],blink=document.querySelector('.blink');let timer=0,utterance=null;
function neutral(){clearInterval(timer);timer=0;mouths.forEach(x=>x.classList.remove('on'));closed.classList.remove('off')}
function showMouth(i){closed.classList.add('off');mouths.forEach((x,n)=>x.classList.toggle('on',n===i))}
function blinkOnce(){eyes.forEach(x=>x.classList.add('off'));blink.classList.add('on');setTimeout(()=>{blink.classList.remove('on');eyes.forEach(x=>x.classList.remove('off'))},140)}
document.querySelector('#blink').onclick=blinkOnce;document.querySelector('#stop').onclick=()=>{speechSynthesis.cancel();neutral()};
document.querySelector('#talk').onclick=()=>{speechSynthesis.cancel();neutral();let n=0;timer=setInterval(()=>showMouth([0,1,0,2,0,1][n++%6]),145);utterance=new SpeechSynthesisUtterance("Hi! I am Riki. My face stays perfectly still while my mouth talks.");utterance.rate=.92;utterance.pitch=1.18;utterance.onend=neutral;utterance.onerror=neutral;speechSynthesis.speak(utterance)};
</script></body></html>
