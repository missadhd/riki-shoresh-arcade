<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steady layered Riki preview</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff4f8,#eeeaff);font:700 16px system-ui;color:#5a3549;display:grid;place-items:center}.card{width:min(94vw,680px);padding:18px;background:#fffafd;border:3px solid #efc2d5;border-radius:28px;box-shadow:0 18px 50px #8d42682b}.back{color:#a53764;text-decoration:none}.top{text-align:center}.top h1{margin:10px 0 4px;color:#d53772;font-size:clamp(25px,6vw,38px)}.top p{margin:5px auto 14px;max-width:570px;line-height:1.35}.stage{height:min(64vh,570px);min-height:430px;position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 50% 30%,#fff 0,#fff0f6 55%,#e9e1ff 100%)}.doll{position:absolute;inset:0;display:grid;place-items:center}.sprite{position:relative;height:95%;aspect-ratio:3/4;max-width:96%;filter:drop-shadow(0 12px 10px #713c5630)}.sprite img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.sprite .layer{opacity:0;transition:opacity 28ms linear}.sprite .layer.on{opacity:1}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:14px}button{border:0;border-radius:999px;padding:12px 18px;background:#d83c76;color:white;font-weight:900;font-size:15px;box-shadow:0 4px 0 #a12958;cursor:pointer}button.alt{background:#8069ca;box-shadow:0 4px 0 #59489a}.status{text-align:center;min-height:24px;margin:12px 0 0;color:#936078}@media(prefers-reduced-motion:reduce){.sprite .layer{transition:none}}</style></head><body><main class="card"><a class="back" href="./">← Back to the arcade</a><div class="top"><h1>Steady layered Riki test</h1><p>Riki now stays completely still. Only her rendered mouth or eyelids change, so speaking does not resize or flash the character.</p></div><div class="stage"><div class="doll"><div class="sprite" id="sprite"><img class="base" src="assets/images/dolls/riki-talk-closed.webp?v=steady-2" alt="Riki"><img class="layer" data-layer="small" src="assets/images/dolls/riki-mouth-small.webp?v=steady-2" alt=""><img class="layer" data-layer="wide" src="assets/images/dolls/riki-mouth-wide.webp?v=steady-2" alt=""><img class="layer" data-layer="blink" src="assets/images/dolls/riki-eyes-blink.webp?v=steady-2" alt=""></div></div></div><div class="controls"><button id="talk">▶ Hear Riki talk</button><button class="alt" data-show="closed">Closed</button><button class="alt" data-show="small">Small sound</button><button class="alt" data-show="wide">Wide sound</button><button class="alt" data-show="blink">Blink</button></div><p class="status" id="status">Steady animation ready.</p></main><script>(()=>{const status=document.getElementById('status'),layers=[...document.querySelectorAll('[data-layer]')];let speaking=false,blinkTimer;function show(name){layers.forEach(x=>x.classList.toggle('on',x.dataset.layer===name));status.textContent={closed:'Natural closed expression',small:'Small speech sound',wide:'Wide speech sound',blink:'Natural blink'}[name]}function scheduleBlink(){clearTimeout(blinkTimer);blinkTimer=setTimeout(()=>{if(!speaking){show('blink');setTimeout(()=>{show('closed');scheduleBlink()},115)}else scheduleBlink()},3500+Math.random()*2500)}document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>show(b.dataset.show));document.getElementById('talk').onclick=()=>{try{speechSynthesis.cancel();speaking=true;const u=new SpeechSynthesisUtterance('Hi! Now I stay still while only my mouth moves, so talking feels calm and easy to watch.');u.pitch=1.16;u.rate=.92;const sounds=['small','closed','small','wide','small','closed','small','wide'];let i=0,t=setInterval(()=>show(sounds[i++%sounds.length]),125);u.onend=u.onerror=()=>{clearInterval(t);speaking=false;show('closed');scheduleBlink()};speechSynthesis.speak(u);status.textContent='Riki is speaking…'}catch(e){status.textContent='Use the expression buttons to preview each layer.'}};Promise.all([...document.images].map(x=>x.decode?.().catch(()=>{})||Promise.resolve())).then(()=>status.textContent='Steady animation ready.');scheduleBlink()})();</script></body></html>
