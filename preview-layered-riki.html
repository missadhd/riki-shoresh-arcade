<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riki — Joint attachment preview</title>
<style>
:root{font-family:ui-rounded,system-ui,sans-serif;color:#56364e;background:#fff4fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:10px}.card{background:#fff;border:1px solid #efd4e6;border-radius:24px;overflow:hidden}.header{text-align:center;padding:16px}.header h1{font-size:clamp(22px,5vw,32px);margin:0}.header p{margin:6px 0;color:#796073}.stage{position:relative;width:min(100%,440px);aspect-ratio:3/4;margin:auto}.stage canvas,.stage svg{display:block;width:100%;height:100%}.stage svg{position:absolute;inset:0;pointer-events:none}.panel{padding:4px 16px 20px}.row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:9px}.label{text-align:center;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#946582;margin-top:14px}button{border:0;border-radius:24px;min-height:44px;padding:10px 16px;background:#f2dcea;color:#56364e;font:700 14px system-ui;cursor:pointer}button.primary,button.selected{background:#bd347f;color:#fff}button:focus-visible{outline:3px solid #7438ea;outline-offset:2px}#status{text-align:center;min-height:24px;font-size:13px;color:#796073;margin:4px 0}.note{font-size:13px;line-height:1.4;color:#796073;margin:16px auto 0;max-width:600px}@media(max-width:520px){button{flex:1 1 29%;padding-inline:8px}}
</style></head><body><main><section class="card"><div class="header"><h1>Riki’s dress-up preview</h1><p>Choose an outfit and try her movements.</p></div>
<div class="stage" aria-label="Riki doll"><canvas id="rigCanvas" aria-label="Animated Riki"></canvas><svg id="jewelry" aria-hidden="true"></svg></div><p id="status" role="status">Loading Riki…</p>
<div class="panel"><div class="label">Outfit</div><div class="row"><button data-outfit="none" aria-pressed="false">Basics</button><button data-outfit="dress" class="selected" aria-pressed="true">Pink dress</button><button data-outfit="mint" aria-pressed="false">Mint dress</button></div>
<div class="label">Accessories</div><div class="row"><button id="earrings" class="selected" aria-pressed="true">Earrings</button><button id="headband" class="selected" aria-pressed="true">Headband</button><button id="bracelet" class="selected" aria-pressed="true">Bracelet</button><button data-shoes="white" class="selected" aria-pressed="true">White shoes</button><button data-shoes="pink" aria-pressed="false">Pink shoes</button><button data-shoes="mint" aria-pressed="false">Mint shoes</button></div>
<div class="label">Actions</div><div class="row"><button data-action="wave">Wave</button><button data-action="walk">Walk</button><button data-action="jump">Jump</button><button data-action="nod">Nod</button><button data-action="listen">Listen</button><button data-action="think">Think</button><button data-action="reach">Reach</button><button data-action="celebrate">Celebrate</button></div>
<div class="row"><button class="primary" id="talk">Hear Riki talk</button><button id="blink">Blink</button><button id="stop">Stop</button></div>
<p class="note">This is the character preview. Try the fit here before the new rig is added to the games.</p></div></section></main><script src="assets/scripts/riki-joint-preview.js?v=joint-1"></script></body></html>
