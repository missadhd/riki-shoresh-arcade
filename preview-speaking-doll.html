<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rigged speaking doll preview</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff4f8,#eee9ff);font:700 16px system-ui;color:#593447;display:grid;place-items:center}.card{width:min(94vw,720px);background:#fff9fc;border:3px solid #efbfd3;border-radius:28px;padding:18px;box-shadow:0 18px 50px #8d426833}.top{text-align:center}.top h1{margin:0;color:#cf3970;font-size:clamp(24px,5vw,36px)}.top p{margin:6px auto 14px;max-width:560px;line-height:1.35}#stage{height:min(62vh,540px);min-height:420px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#fff 0,#ffe9f2 46%,#e9dcff 100%);position:relative}canvas{display:block;width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:14px}button{border:0;border-radius:999px;padding:12px 18px;background:#d83c76;color:#fff;font-weight:900;font-size:15px;box-shadow:0 4px 0 #9f2855;cursor:pointer}button.secondary{background:#8068c9;box-shadow:0 4px 0 #58449d}.status{text-align:center;min-height:24px;margin:12px 0 0;color:#88596f}.back{display:inline-block;color:#9d3660;margin-bottom:10px;text-decoration:none}</style></head><body><main class="card"><a class="back" href="./">← Back to the arcade</a><div class="top"><h1>Polished Riki master preview</h1><p>This review model uses sculpted hair, detailed eyes and lashes, fingers, layered clothing, blinking, and four real 3D speech shapes.</p></div><div id="stage" aria-label="Interactive 3D speaking doll"></div><div class="controls"><button id="talk">▶ Hear her talk</button><button class="secondary" data-mouth="0">Closed</button><button class="secondary" data-mouth="1">Small sound</button><button class="secondary" data-mouth="2">Wide sound</button><button class="secondary" data-mouth="3">Round sound</button></div><p class="status" id="status">Loading the facial rig…</p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script>(()=>{const host=document.getElementById('stage'),status=document.getElementById('status'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,1,.1,100),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);camera.position.set(0,3.0,10);camera.lookAt(0,2.35,0);scene.add(new THREE.HemisphereLight(0xfff5fb,0x806590,.85));const key=new THREE.DirectionalLight(0xffffff,1.05);key.position.set(-4,-6,8);scene.add(key);const rim=new THREE.DirectionalLight(0xffa9ca,.35);rim.position.set(5,2,5);scene.add(rim);let doll,mouth,blinkMeshes=[];function size(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',size);size();function setMouth(n){if(!mouth)return;mouth.morphTargetInfluences.fill(0);if(n===1)mouth.morphTargetInfluences[mouth.morphTargetDictionary.SpeechSmall]=1;if(n===2)mouth.morphTargetInfluences[mouth.morphTargetDictionary.SpeechWide]=1;if(n===3)mouth.morphTargetInfluences[mouth.morphTargetDictionary.SpeechO]=1;status.textContent=['Natural closed mouth','Small speech sound','Wide speech sound','Rounded vowel sound'][n];}new THREE.GLTFLoader().load('assets/models/riki-speaking.glb',g=>{doll=g.scene;doll.rotation.y=0;scene.add(doll);doll.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.name==='MouthRig')mouth=o;if(o.morphTargetDictionary?.Blink!==undefined)blinkMeshes.push(o);}});status.textContent=mouth?'Facial rig ready — tap Hear her talk.':'Model loaded';setMouth(0);},undefined,e=>status.textContent='The 3D preview could not load.');document.querySelectorAll('[data-mouth]').forEach(b=>b.onclick=()=>setMouth(+b.dataset.mouth));document.getElementById('talk').onclick=()=>{if(!mouth)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Hi! I am a real three dimensional doll, and my mouth is rigged to talk with me.');u.pitch=1.18;u.rate=.92;const sounds=[1,3,1,2,1,1,3,2];let flip=0,t=setInterval(()=>setMouth(sounds[flip++%sounds.length]),125);u.onend=u.onerror=()=>{clearInterval(t);setMouth(0)};speechSynthesis.speak(u);status.textContent='Speaking with the facial rig…';}catch(e){status.textContent='Use the mouth buttons to test the rig.';}};function loop(t){requestAnimationFrame(loop);if(doll)doll.rotation.y=0+Math.sin(t/2600)*.035;renderer.render(scene,camera)}loop(0);})();</script></body></html>
