import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const host=document.querySelector('#view'),scene=new T.Scene();scene.background=new T.Color('#fff3f9');const cam=new T.PerspectiveCamera(38,1,.1,100);cam.position.set(5,3.5,7);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.outputColorSpace=T.SRGBColorSpace;host.append(r.domElement);const ctl=new OrbitControls(cam,r.domElement);ctl.target.set(0,1.65,0);ctl.enableDamping=true;ctl.minDistance=3.5;ctl.maxDistance=12;ctl.maxPolarAngle=Math.PI*.52;scene.add(new T.HemisphereLight(0xffffff,0xbda5ba,2.4));const sun=new T.DirectionalLight(0xffffff,2.7);sun.position.set(-3,6,5);scene.add(sun);

const hinge=new T.Group();hinge.position.set(-.65,0,.72);fridge.add(hinge);cube(hinge,1.3,3.1,.12,pink,.65,1.7,.01);cube(hinge,.1,.6,.1,gold,1.14,1.65,.13);const hs=new T.Shape();hs.moveTo(0,-.18);hs.bezierCurveTo(-.5,.03,-.34,.48,0,.25);hs.bezierCurveTo(.34,.48,.5,.03,0,-.18);const heart=new T.Mesh(new T.ExtrudeGeometry(hs,{depth:.03,bevelEnabled:true,bevelSize:.015,bevelThickness:.015,bevelSegments:2}),cream);heart.position.set(.65,2.4,.1);hinge.add(heart);for(const x of[-.44,.44])for(const z of[-.44,.44])cube(fridge,.18,.13,.18,gold,x,.08,z);cube(scene,100,.06,100,mat('#f5dce8'),0,-.05,0);
let opened=false,ci=0;document.querySelector('#door').onclick=()=>{opened=!opened;document.querySelector('#door').textContent=opened?'Close fridge':'Open fridge'};document.querySelector('#color').onclick=()=>{pink.color.set(['#f1a5c5','#b8dfd3','#d1b7ef','#f6d48d'][++ci%4])};document.querySelector('#reset').onclick=()=>{cam.position.set(5,3.5,7);ctl.target.set(0,1.65,0);ctl.update()};function resize(){const w=host.clientWidth,h=host.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();r.setSize(w,h)}addEventListener('resize',resize);resize();function loop(){requestAnimationFrame(loop);hinge.rotation.y+=((opened?-1.7:0)-hinge.rotation.y)*0.12;ctl.update();r.render(scene,cam)}loop();
