et'],['\u05e9\u05d0\u05dc','Ask','Ask a question'],['\u05d3\u05d1\u05e8','Speak','Speak to someone'],['\u05e8\u05d0\u05d4','See','A ray of light helps you see'],['\u05e7\u05d5\u05dd','Get up / Stand','Get up from your chair'],['\u05dc\u05e7\u05d7','Take','Take something'],['\u05d9\u05db\u05dc','Can / Be able','I can do it'],['\u05d1\u05e8\u05db','Bless','Bracha means blessing'],['\u05d6\u05e8\u05d7','Shine / Rise','Sunrise shines'],['\u05d0\u05db\u05dc','Eat','Eat your food'],['\u05e0\u05e9\u05d0','Carry / Lift','Lift and carry'],['\u05e9\u05d7\u05d4','Bow','Bow down'],['\u05e0\u05d2\u05e9','Approach / Come near','Come closer'],['\u05e8\u05d5\u05e6','Run','Run fast'],['\u05e0\u05e4\u05dc','Fall','Fall down'],['\u05e0\u05e9\u05e7','Kiss','Give a kiss'],['\u05d1\u05db\u05d4','Cry','Cry tears'],['\u05e2\u05dc\u05d4','Go up / Ascend','Go upstairs']];\n\nconst HEBREW_CUSTOM_KEY='rikiCustomShorashimV1';\nfunction hebrewCustomRead(){try{const x=JSON.parse(localStorage.getItem(HEBREW_CUSTOM_KEY)||'[]');return Array.isArray(x)?x.filter(a=>Array.isArray(a)&&a.length===3&&a.every(v=>typeof v==='string')):[]}catch(_){return []}}\nW.push(...hebrewCustomRead().filter(a=>!W.some(w=>w[0]===a[0])));\nfunction hebrewRootEditor(){game='hebrew-editor';session=null;const safe=x=>esc(x);app.innerHTML=`<section class=\"panel\"><button class=\"secondary\" id=\"hebrewEditorBack\">\u2190 Hebrew games</button><h2>\u270f\ufe0f Add Hebrew \u05e9\u05d5\u05e8\u05e9\u05d9\u05dd</h2><p>Add a shoresh, its English meaning and a memory hint. New roots join the Hebrew question pool in the existing games on this device.</p><form id=\"hebrewRootForm\" style=\"display:grid;gap:12px\"><label>\u05e9\u05d5\u05e8\u05e9 (Hebrew root)<input id=\"hebrewNewRoot\" dir=\"rtl\" maxlength=\"12\" required placeholder=\"\u05db\u05ea\u05d1\"></label><label>English meaning<input id=\"hebrewNewMeaning\" maxlength=\"100\" required placeholder=\"Write\"></label><label>Memory hint<input id=\"hebrewNewHint\" maxlength=\"180\" required placeholder=\"Think of writing a letter\"></label><button class=\"primary\" type=\"submit\">Save new shoresh</button></form><p id=\"hebrewRootStatus\" role=\"status\"></p></section><section class=\"panel\"><h3>My added roots</h3><div id=\"hebrewRootList\"></div></section>`;\nconst draw=()=>{const list=hebrewCustomRead();$('#hebrewRootList').innerHTML=list.length?list.map((r,i)=>`<div style=\"padding:12px 0;border-bottom:1px solid #ddd\"><strong dir=\"rtl\">${safe(r[0])}</strong> \u2014 ${safe(r[1])}<p>${safe(r[2])}</p><button class=\"secondary\" data-remove-root=\"${i}\">Remove</button></div>`).join(''):'No added roots yet.';document.querySelectorAll('[data-remove-root]').forEach(b=>b.onclick=()=>{const roots=hebrewCustomRead(),removed=roots.splice(Number(b.dataset.removeRoot),1)[0];try{localStorage.setItem(HEBREW_CUSTOM_KEY,JSON.stringify(roots));const idx=W.findIndex(w=>w[0]===removed[0]);if(idx>=0)W.splice(idx,1);draw()}catch(_){$('#hebrewRootStatus').textContent='Could not save changes.'}})};\n$('#hebrewEditorBack').onclick=menu;$('#hebrewRootForm').onsubmit=e=>{e.preventDefault();const root=$('#hebrewNewRoot').value.trim().replace(/[\\u0591-\\u05c7]/g,''),meaning=$('#hebrewNewMeaning').value.trim(),hint=$('#hebrewNewHint').value.trim();if(!/^[\\u05d0-\\u05ea]{2,5}$/.test(root)){ $('#hebrewRootStatus').textContent='Enter 2\u20135 Hebrew letters for the root.';return}if(W.some(w=>w[0]===root)){ $('#hebrewRootStatus').textContent='This root is already in the games.';return}const roots=hebrewCustomRead();roots.push([root,meaning,hint]);try{localStorage.setItem(HEBREW_CUSTOM_KEY,JSON.stringify(roots));W.push([root,meaning,hint]);$('#hebrewRootStatus').textContent='Saved! Your new root is ready for Hebrew games.';e.target.reset();draw()}catch(_){$('#hebrewRootStatus').textContent='Could not save on this device.'}};draw()}\nconst $=s=>document.querySelector(s), app=$('#app');const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nlet coins=0;try{coins=Math.max(0,Number(localStorage.getItem('rickyCoins')||0))}catch{}let streak=0,soundOn=true,ctx=null,mode='all',game='',session=null,round=0;\nfunction audio(kind){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let notes=kind==='win'?[523,659,784,1047]:kind==='good'?[659,880]:kind==='bad'?[250,220]:kind==='tap'?[440]:[450,550];notes.forEach((freq,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.085;o.type=kind==='bad'?'triangle':'sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.18)})}catch{}}\nfunction celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#ff71ad','#7a59dd','#ffd45b','#5bd8bf'];for(let i=0;i<45;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=colors[i%4];d.style.animationDelay=Math.random()*.45+'s';d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}}\n/* Rewards remain in the coin balance without interrupting play. */\nfunction award(n){coins+=n;try{localStorage.setItem('rickyCoins',coins)}catch{}updateStats();}\nfunction updateStats(){const coinEl=$('#coins'),streakEl=$('#streak');if(coinEl)coinEl.textContent='\ud83e\ude99 '+coins;if(streakEl)streakEl.textContent='\ud83d\udd25 '+streak;const scoreEl=document.querySelector('.gamehead .pill');if(scoreEl&&session)scoreEl.textContent=(session.score||0)+' \u2b50';document.querySelectorAll('[data-live-coins]').forEach(el=>el.textContent='\ud83e\ude99 '+coins);document.querySelectorAll('.quest-hint').forEach(el=>{const t=el.textContent;el.textContent=t.replace(/\ud83e\ude99\\s*[\\d,]+\\s*coins\\b/,'\ud83e\ude99 '+coins+' coins')});document.querySelectorAll('[data-live-stars]').forEach(el=>{if(session)el.textContent='\u2b50 '+(session.score||0)})}\n$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'\ud83d\udd0a Sound on':'\ud83d\udd07 Sound off';if(soundOn)audio('tap')};$('#fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};\n$('#houseShortcut').onclick=()=>houseHome(); const rkShopNav=document.createElement('button');rkShopNav.type='button';rkShopNav.id='rkShopShortcut';rkShopNav.className='smallbtn';rkShopNav.textContent='\ud83d\udecd\ufe0f Shop';rkShopNav.onclick=()=>{housePage='shop';houseRender();window.scrollTo({top:0,behavior:'smooth'})};document.getElementById('houseShortcut')?.insertAdjacentElement('afterend',rkShopNav); $('#gamesShortcut').onclick=()=>{menu();window.scrollTo({top:0,behavior:'smooth'})}; $('#settingsToggle').onclick=()=>{const panel=$('#soundSettings');panel.hidden=!panel.hidden;$('#settingsToggle').setAttribute('aria-expanded',String(!panel.hidden))};\n\n// Dollhouse: persistent inventory and independently decorated rooms.\nconst ROOMS=[{id:'bedroom',name:'Bedroom',icon:'\ud83d\udecf\ufe0f',wall:'#fbe3f4',floor:'#e6bda8'},{id:'living',name:'Living room',icon:'\ud83d\udecb\ufe0f',wall:'#e3e0ff',floor:'#c6a68e'},{id:'kitchen',name:'Kitchen',icon:'\ud83c\udf53',wall:'#d9f6ed',floor:'#e1c6ac'},{id:'garden',name:'Garden',icon:'\ud83c\udf37',wall:'#d7f6ff',floor:'#8bd5a4'},{id:'playroom',name:'Playroom',icon:'\ud83e\uddf8',wall:'#fff0cb',floor:'#d8b8e6'},{id:'bathroom',name:'Bathroom',icon:'\ud83d\udec1',wall:'#e0f5ff',floor:'#a6d6df'}];\nconst ITEMS=[\n['bed','\ud83d\udecf\ufe0f','Dreamy bed',30,'bedroom'],['lamp','\ud83d\udecb\ufe0f','Cozy couch',40,'living'],['chair','\ud83e\ude91','Comfy chair',22,'living'],['desk','\ud83e\ude9e','Vanity mirror',28,'bedroom'],['plant','\ud83e\udeb4','Pretty plant',15,'any'],['teddy','\u /button></p></section>`;$('#set').onchange=e=>{mode=e.target.value;audio('tap')};document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));$('#visitHouse').onclick=houseHome}\nfunction frame(title,body,progress=''){app.innerHTML=`<section class=\"panel\"><div class=\"gamehead\"><button class=\"secondary\" id=\"home\">\u2190 Game menu</button><strong class=\"game-title-with-doll\">${window.RikiArt?'<span class=\"game-title-doll\" aria-hidden=\"true\">'+window.RikiArt.doll(window.RikiArt.look(window.RikiPlay.state().doll),'stand','neutral',true)+'</span>':''}${title}</strong><span class=\"pill\">${session?.score||0} \u2b50</span></div>${progress?`<div class=\"progress\"><div style=\"width:${progress}%\"></div></div>`:''}${body}</section>`;$('#home').onclick=()=>{audio('tap');menu()}}\nfunction start(g){audio('tap');game=g;round++;const all=shuffle(ids());const count=g==='memory'?Math.min(6,all.length):g==='builder'?Math.min(8,all.length):Math.min(10,all.length);session={order:all.slice(0,count),at:0,score:0,missed:[],done:false,locked:false,hint:0,attempt:0,flip:[],matched:[],pairCount:0,letters:[],chosen:[],tries:0};if(g==='memory')prepareMemory();if(g==='wheel'){session.wheelPhase='ready';session.wheelRotation=0;session.wheelQuestion=null;session.wheelTotal=0;session.wheelResult='';session.wheelLock=false;session.wheelCategory='';session.wheelSpins=0}render()}\nfunction advance(){session.at++;session.locked=false;session.hint=0;session.attempt=0;session.chosen=[];session.tries=0;if(session.at>=session.order.length){finish();return}render()}\nfunction correct(points=3){audio('good');streak++;session.score+=points;award(points*2);updateStats()}\nfunction incorrect(){audio('bad');streak=0;updateStats();const id=session.order[session.at];if(!session.missed.includes(id))session.missed.push(id)}\nfunction finish(){audio('win');celebrate();const count=session.order.length;frame('\ud83c\udf89 Adventure complete!',`<div class=\"end\"><div class e\udee7 Bubble Pop',`<p class=\"subtle\">Bubble ${s.at+1} / ${s.order.length}</p><div class=\"prompt\"><div class=\"eyebrow\">\ud83e\udee7 POP THE RIGHT MEANING!</div><div class=\"hebrew\">${w[0]}</div></div><div class=\"bubblefield\">${s.opts.map((i,k)=>`<button class=\"bubble\" data-bubble=\"${i}\" style=\"background-color:${['#ffd0e8','#c3eaff','#d8cbff'][k]}\" ${s.locked?'disabled':''}>${esc(W[i][1])}</button>`).join('')}</div><div id=\"result\"></div><div class=\"foot\"><button class=\"secondary\" id=\"hint\">\ud83d\udca1 Show memory clue</button><span class=\"subtle\">Pop and collect stars!</span></div>`,100*s.at/s.order.length);$('#hint').onclick=()=>{$('#result').innerHTML=`<div class=\"hintbox\">${esc(w[2])}</div>`;audio('tap')};document.querySelectorAll('[data-bubble]').forEach(b=>b.onclick=()=>{if(s.locked)return;const pick=Number(b.dataset.bubble);if(pick===id){s.locked=true;correct(3);b.classList.add('pop');$('#result').innerHTML=`<div class=\"feedback good\">POP! \ud83c\udf89 ${w[0]} means ${esc(w[1])}!</div><button class=\"primary\" id=\"next\">Next bubbles \u2192</button>`;$('#next').onclick=()=>{if(session!==s)return;s.opts=null;advance()};const answerIndex=s.at;setTimeout(()=>{const next=document.getElementById('next');if(session===s&&s.at===answerIndex&&next&&next.isConnected)next.click()},1100)}else{incorrect();b.classList.add('wrong');b.disabled=true;$('#result').innerHTML='<div class=\"feedback try\">Oops! That bubble was a decoy. Try again! \ud83d\udc9c</div>'}})}\nfunction builder(){const s=session,id=s.order[s.at],w=W[id];if(!s.letters.length){s.letters=shuffle([...w[0]].map((ch,i)=>({ch,i})));s.chosen=[]}const built=s.chosen.map(i=>s.letters[i].ch).join('');const right=built===w[0];frame('\ud83e\udde9 Letter Builder',`<p class=\"subtle\">Build ${s.at+1} / ${s.order.length} \u00b7 Drag or tap letters in Hebrew reading order (right to left)</p><div class=\"prompt\"><div class=\"eyebrow\">BUILD THE SHORESH FOR:</div><div class=\"meaning\">${esc(w[1])}</div></div><div class=\"buildslots\" dir=\"rtl\">${Array.from({length:w[0].length},(_,i)=>`<div class=\"slot\">${esc(built[i]||'')}</div>`).join('')}</div><div class=\"letterbank\" dir=\"rtl\">${s.letters.map((l,i)=>`<button class=\"letter\" data-letter=\"${i}\" ${s.chosen.includes(i)||s.locked?'disabled':''}>${l.ch}</button>`).join('')}</div><div id=\"result\">${s.hint?`<div class=\"hintbox\">\ud83d\udca1 ${esc(w[2])} \u00b7 First letter: <strong>${w[0][0]}</strong></div>`:''}</div><div class=\"foot\"><button class=\"secondary\" id=\"undo\" ${!s.chosen.length||s.locked?'disabled':''}>\u21b6 Undo</button><button class=\"secondary\" id=\"hint\">\ud83d\udca1 Hint</button><button class=\"secondary\" id=\"clear\" ${!s.chosen.length||s.locked?'disabled':''}>Clear</button></div>`,100*s.at/s.order.length);$('#undo').onclick=()=>{s.chosen.pop();audio('tap');builder()};$('#clear').onclick=()=>{s.chosen=[];audio('tap');builder()};$('#hint').onclick=()=>{s.hint=1;audio('tap');builder()};document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{if(s.locked)return;s.chosen.push(Number(b.dataset.letter));audio('tap');const attempt=s.chosen.map(i=>s.letters[i].ch).join('');if(s.chosen.length===w[0].length){if(attempt===w[0]){s.locked=true;correct(s.tries?1:4);builder();$('#result').innerHTML=`<div class=\"feedback good\">\ud83e\udde9 You built it! ${w[0]} = ${esc(w[1])}</div><button class=\"primary\" id=\"next\">Next puzzle \u2192</button>`;$('#next').onclick=()=>{if(session!==s)return;s.letters=[];advance()};const answerIndex=s.at;setTimeout(()=>{const next=document.getElementById('next');if(session===s&&s.at===answerIndex&&next&&next.isConnected)next.click()},1100)}else{s.tries++;incorrect();s.chosen=[];builder();$('#result').innerHTML='<div class=\"feedback try\">Not quite! Try the letters in a different order. \ud83d\udc9c</div>'}}else builder()})}\nfunction sort(){const s=session,id=s.order[s.at],w=W[id];s.opts=s.opts||optionsFor(id,4,true);frame('\ud83d\u ,...prizes].map((item,i)=>`<button data-life-item=\"${i}\" class=\"${chosen===item?'active':''}\">${item}</button>`).join('')}</div><p class=\"subtle\">Tap a stored item to take it out. Your arrangements are saved on this device.</p><p id=\"lifeFeedback\" class=\"feedback good\"></p></section>`;$('#lifeBack').onclick=menu;document.querySelectorAll('[data-life-room]').forEach(b=>b.onclick=()=>{living.room=b.dataset.lifeRoom;living.openDrawer=-1;saveLiving();showLivingHouse()});document.querySelectorAll('[data-life-item]').forEach(b=>b.onclick=()=>{living.selected=[...collectables,...prizes][Number(b.dataset.lifeItem)];audio('tap');showLivingHouse()});document.querySelectorAll('[data-life-shelf]').forEach(b=>b.onclick=()=>{let arr=living.shelves[r]||[null,null,null],i=Number(b.dataset.lifeShelf);if(living.selected){arr[i]=living.selected;living.selected=''}else{living.selected=arr[i]||'';arr[i]=null}living.shelves[r]=arr;saveLiving();audio('good');showLivingHouse()});document.querySelectorAll('[data-life-drawer]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.lifeDrawer),arr=living.drawers[r]||[[],[],[]];if(living.openDrawer===i&&living.selected){arr[i].push(living.selected);living.selected='';living.drawers[r]=arr}else living.openDrawer=living.openDrawer===i?-1:i;saveLiving();audio('tap');showLivingHouse()});document.querySelectorAll('[data-drawer-object]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [i,j]=b.dataset.drawerObject.split('-').map(Number);living.selected=living.drawers[r][i].splice(j,1)[0];saveLiving();showLivingHouse()});$('#lifeLamp').onclick=()=>{living.lights[r]=!living.lights[r];saveLiving();audio('tap');showLivingHouse()};$('#lifeCloset').onclick=()=>{living.closets[r]=!living.closets[r];saveLiving();showLivingHouse()};$('#lifeFridge').onclick=()=>{$('#lifeFeedback').textContent=r==='kitchen'?'\ud83e\udd5b The refrigerator is open! Choose a treat from your collectibles.':'\u2728 Mirror, mirror! Your room looks lovely!';audio('tap')};$('#lifeBed').onclick=()=>{$('#lifeFeedback').textContent='\u2728 You tidied up the room!';audio('good')};$('#lifeParty').onclick=()=>{living.party=!living.party;saveLiving();celebrate();showLivingHouse()};$('#lifeFish').onclick=()=>{$('#lifeFeedback').textContent='\ud83d\udc20 '+((living.fish||[]).join(' ')||'Rescue fish in Aquarium Rescue to fill your tank!')};$('#lifeShop').onclick=houseHome}\n// Connect the living-house button to the original decorating page as well.\nconst oldHouseRender=houseRender;\nhouseRender=function(){oldHouseRender();const nav=document.querySelector('.house-nav');if(nav){nav.insertAdjacentHTML('beforeend','<button class=\"secondary\" id=\"playHouse\">\ud83e\uddf8 Play inside</button>');$('#playHouse').onclick=showLivingHouse}};\n\n/* Dedicated SEL arcade: scenario practice, not diagnostic or compliance training. */\nconst SEL_MODES=[\n{id:'flex',emoji:'\ud83e\udd8b',name:'Plan B Power',subtitle:'Flexible thinking when plans change',theme:'flexibility'},\n{id:'pause',emoji:'\ud83e\uddca',name:'Pause & Choose',subtitle:'Practice stopping before reacting',theme:'impulse control'},\n{id:'friend',emoji:'\ud83d\udcac',name:'Friendship Studio',subtitle:'Friendship, boundaries, and repair',theme:'social skills'},\n{id:'feel',emoji:'\ud83c\udf26\ufe0f',name:'Feelings Detective',subtitle:'Notice emotions and body clues',theme:'emotional awareness'},\n{id:'solve',emoji:'\ud83e\udde9',name:'Problem-Solving Lab',subtitle:'Find solutions that work for everyone',theme:'problem solving'},\n{id:'reset',emoji:'\ud83c\udf08',name:'Calm-Down Lab',subtitle:'Try a tool and choose what helps you',theme:'self-regulation'}\n];\nconst SEL_SCENES={\nflex:[\n['\ud83c\udfa8\ud83d\udd8c\ufe0f','You planned to use the purple marker, but someone is using it.','What could you try?', ['Grab it from them.','Ask when they will be finished, or choose another color for now.','Give up on your whole picture.'],1,'It is disappointing when your first plan changes. You can keep your goal and try a different path.','\u201cI wanted purple. Can I use it when you are done?\u201d'],\n['\ud83c\udf55\ud83e\udd6a','You expected pizza for lunch, but today there are sandwiches.','Which response gives you the most choices?', ['Say what you hoped for and see what food options are available.','Throw the lunch away.','Refuse to talk to anyone.'],0,'You can be disappointed and still look for a workable option.','\u201cI was expecting pizza. What else can I choose?\u201d'],\n['\ud83c\udfb2\ud83c\udf27\ufe0f','Your outdoor game is canceled because it is raining.','What is a flexible Plan B?', ['Tell everyone the day is ruined.','Keep asking until the weather changes.','Pick an indoor game and save the outdoor game for later.'],2,'Plan B does not mean you have to like the change. It means you can still have fun.','\u201cI am disappointed. Can we do it tomorrow?\u201d'],\n['\ud83d\udc5f\ud83d\ude8c','You wanted to be first in line, but another child got there first.','What helps?', ['Push ahead.','Choose where to stand and focus on getting to the activity.','Leave the line forever.'],1,'Not being first can feel frustrating. Your place in line does not decide your worth.','\u201cI wanted first, but I can handle second.\u201d']\n],\npause:[\n['\ud83c\udfae\ud83d\ude24','You lose a game after trying really hard. Your hands feel tight.','What is a good first move?', ['Throw the controller.','Take one step back, unclench your hands, and decide what to say.','Call the other player names.'],1,'A pause gives your brain a moment to catch up with your feelings.','\u201cI am frustrated. I need a minute.\u201d'],\n['\ud83d\udcdd\ud83d\udca5','Your homework feels too hard and you want to rip the paper.','What could you do?', ['Ask for one hint or a short break.','Rip it immediately.','Pretend you finished.'],0,'Asking for support is a problem-solving skill, not a failure.','\u201cCan you help me start just one question?\u201d'],\n['\ud83d\udde3\ufe0f\u26a1','Someone interrupts while you are talking. You want to shout.','What is one way to respond?', ['Interrupt even louder.','Walk away without saying anything every time.','Say \u201cI wasn\u2019t finished yet\u201d in a firm voice.'],2,'You can stand up for yourself without yelling or hurting someone.','\u201cPlease let me finish my thought.\u201d'],\n['\ud83c\udf92\ud83d\ude20','Someone bumps your backpack. You do not know if it was on purpose.','What should you do first?', ['Ask what happened before deciding their intention.','Assume they did it to be mean.','Bump them back.'],0,'Checking the facts helps avoid a fight based on a guess.','\u201cHey, was that an accident?\u201d']\n],\nfriend:[\n['\ud83d\udc67\ud83d\udc67\ud83c\udfb2','A friend wants to play something different from you.','How can you both have a say?', ['Make them play your choice.','Offer to take turns choosing or find a game you both like.','Tell them you are not friends anymore.'],1,'Friends can want different things and still be friends.','\u201cCan we do your game first and mine next?\u201d'],\n['\ud83e\uddf8\ud83d\ude45','A friend says \u201cNo, I do not want a hug.\u201d','What respects their boundary?', ['Hug them anyway.','Tell them they are mean.','Say \u201cOkay\u201d and give them space.'],2,'Everyone gets to decide about touch, including you.','\u201cOkay! Would you like a wave instead?\u201d'],\n['\ud83d\udcac\ud83d\ude1e','You said something that hurt a friend\u2019s feelings.','What could help repair things?', ['Listen, apologize for the hurt, and ask what would help.','Tell them they are too sensitive.','Pretend nothing happened.'],0,'Repair means taking responsibility without deciding how fast someone must forgive.','\u201cI am sorry I said that. I will try differently.\u201d'],\n['\ud83e\udde9\ud83d\udc40','Two friends are talking quietly. You think they might be talking about you.','What is a fair way to handle the uncertainty?', ['Spread a rumor first.','Remember there are many possible explanations and ask kindly if needed.','Demand they stop talking.'],1,'A thought is not always a fact. You can check without accusing.','\u201cI am feeling left out. Can I join you?\u201d']\n],\nfeel:[\n['\u2764\ufe0f\u200d\ud83d\udd25\ud83d\ude21','Your cheeks get hot, your jaw tightens, and you want to shout.','Which feeling might be showing up?', ['Anger or frustration.','Sleepiness only.','Nothing at all.'],0,'Your body can give early clues. Noticing them helps you choose what to do next.','\u201cMy jaw is tight. I might need a break.\u201d'],\n['\ud83e\udd8b\ud83d\ude2c','Your stomach feels fluttery before you try something new.','What could that mean?', ['You are definitely in danger.','You may be nervous or excited, or both.','You must quit.'],1,'Sometimes nervous and excited feel similar in the body.','\u201cI have butterflies. I can try one small step.\u201d'],\n['\ud83c\udfc6\ud83e\udd79','Your friend wins an award. You feel happy for them and a little jealous.','Is it okay to have two feelings?', ['No, pick one feeling.','Jealousy means you are a bad friend.','Yes. Mixed feelings are normal.'],2,'Feelings are information, not rules for how you must act.','\u201cI am happy for her, and I wish I won too.\u201d'],\n['\ud83c\udf27\ufe0f\ud83d\ude14','A friend cancels plans. You feel sad and disappointed.','What is a useful next step?', ['Name your feeling and think of something else you would enjoy.','Tell them they can never be your friend.','Hide every feeling forever.'],0,'You can care about your plans and find another way to spend your time.','\u201cI am disappointed. Maybe we can reschedule.\u201d']\n],\nsolve:[\n['\ud83d\udcda\ud83d\udc6f','Two people both want the same library book.','What could be a fair solution?', ['Take it secretly.','Ask about turns, a waitlist, or another copy.','Tell the other person they are selfish.'],1,'A good solution considers both people\u2019s needs.','\u201cCould I have it when you finish?\u201d'],\n['\ud83c\udfc0\ud83d\udeab','A group says the team is full when you ask to join.','What can you do?', ['Ask when you can join next, or start another activity.','Insult the team.','Take the ball.'],0,'Being left out hurts. You can ask for inclusion and still choose another option.','\u201cCan I play in the next round?\u201d'],\n['\ud83e\uddf1\ud83d\udc6d','You and your partner disagree about how to build a project.','What could you suggest?', ['Refuse every idea except yours.','Stop the project.','Try both ideas in a small test and compare them.'],2,'Testing ideas turns an argument into teamwork.','\u201cLet\u2019s try your idea and mine.\u201d'],\n['\ud83c\udf82\u23f0','You have two things you want to do but only time for one.','How could you decide?', ['Get angry at the clock.','Choose what matters most now and plan the other for later.','Do neither.'],1,'Choosing one thing does not mean the other is gone forever.','\u201cWhich one matters most today?\u201d']\n]};\nconst SEL_GRADE4_MORE={\"flex\":[[\"\ud83d\udcda\ud83d\udd04\",\"Your teacher changes the assignment after you already started.\",\"What is a useful next move?\",[\"Complain until the old assignment comes back.\",\"Ask what work you can keep and what needs changing.\",\"Throw away your work.\"],1,\"A changed direction is annoying. Clarifying the new expectations protects your effort.\",\"\u201cI started the first version. Which parts can I still use?\u201d\"],[\"\ud83d\udc6f\ud83d\udccb\",\"Your group votes for a project idea different from yours.\",\"How can you stay involved?\",[\"Refuse to contribute.\",\"Tell everyone their idea is terrible.\",\"Share one concern and help make the chosen idea work.\"],2,\"Flexibility does not require pretending you agree. You can disagree respectfully and participate.\",\"\u201cI preferred mine, but how can I help with this plan?\u201d\"],[\"\ud83c\udfc0\ud83d\udcc5\",\"A friend promised to hang out but got invited to a team practice.\",\"What response keeps options open?\",[\"Say you are disappointed and ask to pick another day.\",\"Tell everyone your friend is fake.\",\"Demand they skip practice.\"],0,\"Plans changing can sting. One change does not tell the whole story of a friendship.\",\"\u201cI was looking forward to it. Is Saturday possible?\u201d\"],[\"\ud83e\udde0\u270f\ufe0f\",\"You solved a math problem one way, but the teacher asks you to show a different method.\",\"What helps you learn without giving up your approach?\",[\"Insist your way is the only way.\",\"Ask to compare the methods and understand why.\",\"Refuse to show any work.\"],1,\"Two methods can be useful even when you prefer one.\",\"\u201cCan you show me how your method connects to mine?\u201d\"],[\"\ud83c\udfa4\ud83d\udd01\",\"You prepared to present first, but the schedule changes and you go last.\",\"What is a flexible strategy?\",[\"Interrupt every presentation.\",\"Leave class.\",\"Use the extra time to rehearse and ask when your turn is.\"],2,\"You can be frustrated while using the new situation to your advantage.\",\"\u201cI thought I was first. I'll practice once more.\u201d\"],[\"\ud83e\udde9\ud83e\udd1d\",\"Your partner wants to divide the work differently than you planned.\",\"What is a fair way to adjust?\",[\"Explain what you need and negotiate who does each part.\",\"Do everything yourself without discussing it.\",\"Stop working with them immediately.\"],0,\"A plan can change through negotiation, not just giving in.\",\"\u201cI can do the research if you make the slides.\u201d\"]],\"pause\":[[\"\ud83d\udcf1\ud83d\udcac\",\"A classmate posts an embarrassing joke about you in the class chat.\",\"What should you do before replying?\",[\"Post something mean about them.\",\"Save the message, pause, and decide whether to ask for removal or adult help.\",\"Send ten angry messages.\"],1,\"Online replies can spread quickly. You can protect yourself without escalating.\",\"\u201cPlease take that down. It's not okay with me.\u201d\"],[\"\ud83c\udfeb\ud83d\udde3\ufe0f\",\"The teacher corrects you in front of the class and you feel embarrassed.\",\"Which response protects your point without starting an argument?\",[\"Shout that the teacher is unfair.\",\"Leave without permission.\",\"Take a moment and ask to discuss it privately.\"],2,\"Feeling embarrassed is understandable. A private conversation may get you heard.\",\"\u201cCould I explain what happened after class?\u201d\"],[\"\ud83d\udcd6\ud83d\ude20\",\"You studied hard but your quiz grade is lower than you expected.\",\"What is a helpful first step?\",[\"Check which questions you missed and ask for feedback.\",\"Crumple the quiz and refuse to look.\",\"Tell everyone the teacher hates you.\"],0,\"A grade is information about this quiz, not a judgment of your intelligence.\",\"\u201cCan we go over the ones I missed?\u201d\"],[\"\ud83d\udc6d\ud83d\udca2\",\"A friend says something rude when other classmates are listening.\",\"How can you respond without making it a bigger scene?\",[\"Insult them back.\",\"Say you didn't like it and talk later if needed.\",\"Spread a rumor.\"],1,\"Being firm is different from being hurtful.\",\"\u201cThat wasn't funny to me. Let's talk later.\u201d\"],[\"\u26bd\ud83e\udd14\",\"Someone says you cheated during a game, but you think you followed the rules.\",\"What should you do first?\",[\"Push them.\",\"Quit the friendship forever.\",\"Ask which rule they mean and explain your side calmly.\"],2,\"A disagreement about rules can be solved by checking what happened.\",\"\u201cWhich rule do you think I broke?\u201d\"],[\"\u270f\ufe0f\ud83d\udcad\",\"You keep getting stuck on one homework question and want to stop everything.\",\"What could help you restart?\",[\"Mark the question, try another one, then ask for help.\",\"Tear up the assignment.\",\"Copy a friend's answers.\"],0,\"Getting unstuck can mean changing the order, not giving up.\",\"\u201cI'll skip this one and come back.\u201d\"]],\"friend\":[[\"\ud83d\udc6d\ud83d\udeaa\",\"Two friends make weekend plans in front of you without inviting you.\",\"What is a reasonable response?\",[\"Tell them they are terrible people.\",\"Notice how you feel, and ask about plans or make your own.\",\"Demand they invite you.\"],1,\"Feeling left out is real, but you cannot know their intentions without checking.\",\"\u201cThat sounded fun. Are you planning a group thing?\u201d\"],[\"\ud83d\udcac\ud83d\udd12\",\"A friend tells you a secret that involves someone being unsafe.\",\"What should you do?\",[\"Promise never to tell anyone.\",\"Share it with the whole class.\",\"Tell a trusted adult who can help.\"],2,\"Keeping a friendship secret is less important than someone's safety.\",\"\u201cI care about you, so I need help from an adult.\u201d\"],[\"\ud83d\udcf1\ud83d\ude2c\",\"A friend keeps texting you when you want quiet time.\",\"How can you set a boundary?\",[\"Say when you can talk and put your phone away.\",\"Block them without explanation every time.\",\"Keep replying while getting angrier.\"],0,\"A good boundary is clear and respectful.\",\"\u201cI'm offline tonight. I'll reply tomorrow.\u201d\"],[\"\ud83e\udd1d\ud83c\udf92\",\"Your friend wants you to say you saw something you didn't see so they avoid trouble.\",\"What is the strongest friendship choice?\",[\"Lie to prove loyalty.\",\"Explain you care but won't make up a story.\",\"Tell the whole class immediately.\"],1,\"Real friendship does not require dishonesty.\",\"\u201cI can support you, but I can't say something that isn't true.\u201d\"],[\"\ud83d\udc67\ud83e\uddd1\",\"A classmate you don't usually talk to asks to join your group.\",\"What could you do?\",[\"Ignore them.\",\"Tell them nobody wants them.\",\"Make space when possible or explain kindly if the group is assigned.\"],2,\"Inclusion can be thoughtful without pretending every group has unlimited spots.\",\"\u201cWe have room for one more. Want to help with the poster?\u201d\"],[\"\ud83e\uddd1\u200d\ud83e\udd1d\u200d\ud83e\uddd1\ud83d\udde8\ufe0f\",\"You hear a rumor about your best friend.\",\"What is the most responsible response?\",[\"Don't repeat it; check with your friend privately if needed.\",\"Forward it to see who believes it.\",\"Treat the rumor as proof.\"],0,\"Rumors are not evidence and repeating them can cause harm.\",\"\u201cI heard something confusing. Can I ask you directly?\u201d\"]],\"feel\":[[\"\ud83d\ude2c\ud83d\udce2\",\"You know the answer but freeze when the teacher calls on you.\",\"What might be happening?\",[\"You suddenly forgot everything forever.\",\"You may feel nervous about speaking in front of people.\",\"You must never participate again.\"],1,\"Performance nerves can make thinking harder even when you know the material.\",\"\u201cCould I have a second to think?\u201d\"],[\"\ud83d\ude24\ud83d\udcda\",\"You get irritated at small noises after a long school day.\",\"What could this tell you?\",[\"Everyone is trying to annoy you.\",\"You are a bad person.\",\"You may be mentally tired or overloaded.\"],2,\"Irritability can be a clue that you need rest, food, quiet, or a break.\",\"\u201cI'm overloaded. I need ten quiet minutes.\u201d\"],[\"\ud83c\udfc6\ud83d\ude15\",\"You get a good grade but feel disappointed because your friend did better.\",\"Which statement makes sense?\",[\"You can feel proud and disappointed at the same time.\",\"You are not allowed to feel disappointed.\",\"Your friend's success takes away yours.\"],0,\"Mixed feelings are normal, and comparisons can hide your own progress.\",\"\u201cI improved, even though I hoped for more.\u201d\"],[\"\ud83d\udc6d\ud83d\udc94\",\"A close friend sits with someone else at lunch and your stomach drops.\",\"What might your reaction mean?\",[\"They definitely dislike you.\",\"You may be feeling insecure or worried about being left out.\",\"You should end the friendship.\"],1,\"A strong feeling is real, but it is not always proof of what another person thinks.\",\"\u201cI felt left out today. Can we catch up?\u201d\"],[\"\ud83c\udfa4\ud83c\udf1f\",\"You're excited to perform but also scared you'll make a mistake.\",\"What is true?\",[\"You should cancel.\",\"Being nervous means you aren't ready.\",\"Excitement and fear can happen together.\"],2,\"Courage can mean doing something meaningful while feeling nervous.\",\"\u201cI'm nervous because this matters to me.\u201d\"],[\"\ud83d\ude36\u200d\ud83c\udf2b\ufe0f\ud83e\udde0\",\"You snap at someone, then realize you barely slept.\",\"What is a useful insight?\",[\"Sleep and stress can affect how strongly you react.\",\"You never need to apologize if you're tired.\",\"The other person caused all your feelings.\"],0,\"Understanding a trigger helps you plan, while still taking responsibility for your actions.\",\"\u201cI'm sorry I snapped. I'm tired and need a break.\u201d\"]],\"solve\":[[\"\ud83d\udc69\u200d\ud83c\udfeb\ud83d\udc6d\",\"Your group project partner hasn't done their part and it's due tomorrow.\",\"What should you do?\",[\"Do nothing and hope.\",\"Ask what is done, agree on a specific plan, and involve the teacher if needed.\",\"Tell everyone they are lazy.\"],1,\"Clear expectations and early communication help more than guessing.\",\"\u201cCan you finish the slides tonight? If not, let's tell the teacher.\u201d\"],[\"\ud83d\udcf1\ud83d\udeab\",\"Someone shares your photo without asking.\",\"What is a reasonable next step?\",[\"Share an embarrassing photo of them.\",\"Pretend it doesn't bother you.\",\"Ask them to remove it and get adult help if they refuse.\"],2,\"You can set boundaries about your image and privacy.\",\"\u201cPlease delete that photo. I didn't agree to share it.\u201d\"],[\"\ud83c\udfc0\u2696\ufe0f\",\"Two classmates argue about whether a ball was out of bounds.\",\"How could you help?\",[\"Suggest replaying the point or asking a neutral person.\",\"Pick your friend's side automatically.\",\"Yell louder than both.\"],0,\"A neutral rule helps when memories differ.\",\"\u201cLet's replay the point so it's fair.\u201d\"],[\"\ud83d\udcdd\ud83d\udc6f\",\"Your partner changes your writing without asking and you dislike it.\",\"What is a useful response?\",[\"Delete all their work.\",\"Explain which changes bother you and agree how to edit together.\",\"Refuse to speak to them.\"],1,\"Collaboration works better when everyone knows the editing rules.\",\"\u201cCan we check with each other before changing paragraphs?\u201d\"],[\"\ud83c\udf7d\ufe0f\ud83e\ude91\",\"You want to sit with your usual group, but their table is full.\",\"What is a practical solution?\",[\"Push into the table.\",\"Accuse them of excluding you.\",\"Ask if anyone can move or sit elsewhere today and reconnect later.\"],2,\"A full table is frustrating, but it does not automatically mean rejection.\",\"\u201cIs there room if we move over? If not, see you at recess.\u201d\"],[\"\ud83e\udde0\ud83d\uddd3\ufe0f\",\"You have a test, homework, and a project all due soon.\",\"What is the best planning move?\",[\"List deadlines, break tasks into steps, and ask for help prioritizing.\",\"Try everything at once until you're exhausted.\",\"Ignore the dates.\"],0,\"Breaking work down makes a busy week more manageable.\",\"\u201cI'll do the first ten minutes of the project now.\u201d\"]]};\nfor(const mode of ['flex','pause','friend','feel','solve'])SEL_SCENES[mode]=SEL_GRADE4_MORE[mode].concat(SEL_SCENES[mode]);\nconst SEL_EXTRA_SCENES={\"flex\":[[\"\ud83c\udfeb\ud83d\udcac\",\"Imagine teacher changes the homework instructions.\",\"Which response would help most?\",[\"Ask what changed, explain your preference respectfully, and choose a workable Plan B.\",\"Refuse to participate until everything goes your way.\",\"Pretend the change never happened.\"],0,\"Different people may see the situation differently. A useful response protects your needs while considering others.\",\"\u201cAsk what changed, explain your preference respectfully, and choose a workable Plan B.\u201d\"],[\"\ud83c\udfeb\ud83d\udcac\",\"Imagine your group picks a different p
